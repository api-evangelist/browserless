- aid: browserless:browserless-agent-api
  name: Browserless Agent API
  description: >-
    Run autonomous browser agents. `POST /agent/run` starts an asynchronous run and returns an id to poll
    via `GET /agent/run/:id`; `POST /agent/run/:id/continue` sends it a follow-up task (not enabled in
    v1). `/chromium/agent` connects over WebSocket for a persistent, JSON-RPC-driven agentic browser session
    instead.
  humanURL: https://docs.browserless.io
  baseURL: https://production-sfo.browserless.io
  tags:
  - Agent
