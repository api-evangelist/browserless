- aid: browserless:browserless-proxy-api
  name: Browserless Proxy API
  description: >-
    Discover available proxy locations and configure residential or datacenter routing for your sessions.


    > Residential proxies are only available on Enterprise and Cloud plans.


    Add these parameters to your library or API calls:


    - `?proxy=residential` — residential proxy (6 units/MB).

    - `?proxy=datacenter` — datacenter proxy pool (2 units/MB). Cheaper but more easily detected.

    - `?proxyCountry=us` — two-digit ISO country code.

    - `?proxySticky=true` — keep the same IP for the entire session. Recommended for most cases.

    - `?proxyPreset=px_gov01` — website-specific proxy configuration.
  humanURL: https://docs.browserless.io
