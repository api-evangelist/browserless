      properties:
        id:
          description: Unique profile identifier.
          type: string
        name:
          description: User-supplied profile name. Unique per token.
          type: string
        cookieCount:
          description: Number of cookies captured in the profile.
          type: number
        originCount:
          description: Number of distinct origins with stored localStorage or IndexedDB.
          type: number
        captureSettings:
          $ref: '#/components/schemas/ProfileCaptureSettings'
          description: 'Capture inputs the CLI used, or null for profiles not created by the CLI. The UI

            derives no capture flag from these; it uses any non-empty object to stamp the CLI

            badge and show a read-only summary, and reads `browser`/`profile` specifically to

            decide whether its refresh command needs placeholders for them. The CLI reads the

            rest itself and decides the exclusion behaviour from `excludeDomains`.'
        domainAuth:
          description: 'Per-domain auth status + expiry for the saved logins in this profile, with

            status classified at read time (valid / expiring_soon / expired / unknown).

            Empty for profiles saved before this feature, until their next capture,

            upload, or refresh. Never contains a cookie value.'
          type: array
          items:
            $ref: '#/components/schemas/ProfileDomainAuth'
        lastUsedAt:
          description: ISO timestamp of the last time this profile was applied to a session, or null if never used.
          type: string
        createdAt:
          description: ISO timestamp of when the profile was created.
          type: string
        updatedAt:
          description: ISO timestamp of the last metadata change (e.g., rename).
          type: string
      additionalProperties: false
      required:
      - captureSettings
      - cookieCount
      - createdAt
      - domainAuth
      - id
      - lastUsedAt
      - name
      - originCount
      - updatedAt
    BrowserServerOptions:
      type: object
      additionalProperties: {}
      properties:
        args:
          type: array
          items:
            type: string
        chromiumSandbox:
          type: boolean
        devtools:
          type: boolean
        downloadsPath:
          type: string
        env:
          description: 'Environment for the browser process. Honored by both puppeteer.launch and

            playwright.launchServer. Set server-side to give the session its own TMPDIR

            (see generateScratchDir); a caller-supplied value is merged under it, since

            a session must not be able to point its scratch back at the shared temp dir.


            That merge happens on the object handed to `launch` only. It is kept off

            the session''s stored `launchOptions`, which /sessions serves verbatim.'
          $ref: '#/components/schemas/Record_string_string_undefined'
        headless:
          type: boolean
        ignoreDefaultArgs:
          anyOf:
          - type: array
            items:
              type: string
          - type: boolean
        proxy:
          type: object
          properties:
            bypass:
              type: string
            password:
              type: string
            server:
              type: string
            username:
              type: string
          additionalProperties: false
          required:
          - server
        timeout:
          type: number
        tracesDir:
          type: string
    DomainAuthStatus:
      description: Per-domain auth status, computed at read time from a stored absolute expiry.
      enum:
      - expired
      - expiring_soon
      - unknown
      - valid
      type: string
    UploadResponseDiagnostics:
      description: 'Per-entry counts of cookies, origins, and IndexedDB items the server

        dropped or truncated before persisting. All zero on a clean upload.'
      type: object
      properties:
        skippedMalformedCookies:
          description: Cookies dropped because required fields were missing or wrong type.
          type: number
        skippedPrivateCookies:
          description: Cookies dropped because their domain pointed at a private/internal host.
          type: number
        skippedMalformedOrigins:
          description: Origins dropped because they were malformed or non-http(s).
          type: number
        skippedPrivateOrigins:
          description: Origins dropped because they targeted a private/internal network.
          type: number
        truncatedOrigins:
          description: Origins dropped because the per-profile cap was exceeded.
          type: number
        skippedMalformedIdbDatabases:
          description: IndexedDB databases dropped because required fields were missing.
          type: number
        truncatedIdbDatabases:
          description: IndexedDB databases dropped because the per-origin cap was exceeded.
          type: number
        skippedMalformedIdbStores:
          description: IndexedDB object-stores dropped because required fields were missing.
          type: number
        truncatedIdbEntries:
          description: IndexedDB entries dropped because the per-store cap was exceeded.
          type: number
        skippedMalformedLocalStorageEntries:
          description: localStorage entries dropped because names or values were not strings.
          type: number
        skippedMalformedIdbIndexes:
          description: IndexedDB indexes dropped because required fields were malformed.
          type: number
      additionalProperties: false
      required:
      - skippedMalformedCookies
      - skippedMalformedIdbDatabases
      - skippedMalformedIdbIndexes
      - skippedMalformedIdbStores
      - skippedMalformedLocalStorageEntries
      - skippedMalformedOrigins
      - skippedPrivateCookies
      - skippedPrivateOrigins
      - truncatedIdbDatabases
      - truncatedIdbEntries
      - truncatedOrigins
    Record_string_string_undefined:
      type: object
      additionalProperties: false
    ProfileCaptureSettings:
      description: 'Capture inputs the CLI ran with, so a later `profile refresh` can replay them

        without flags. Null for the CDP saveProfile path and any future non-CLI creator.

        Never holds the token, and omits server/region because a stale stored region

        is a guaranteed 404.'
      type: object
      properties:
        browser:
          description: Raw `--browser` value.
          type: string
        profile:
          description: Raw `--profile` value (source profile directory or display name).
          type: string
        excludeDomains:
          description: 'Effective merged exclusion list. `[]` is meaningful — "captured with no

            exclusions" — and distinct from absent, which means "unknown".'
          type: array
          items:
            type: string
        onlyDomains:
          description: Normalized `--only-domain` hostnames, deduped and capped — not merged with local config.
          type: array
          items:
            type: string
        keepDomains:
          description: Normalized `--keep-domain` hostnames, same normalization, no merge.
          type: array
          items:
            type: string
        autoFit:
          description: Whether `--auto-fit` was used.
          type: boolean
        passwordStore:
          description: Raw `--password-store` value. Linux only.
          type: string
        cliVersion:
          description: CLI version that produced these settings, for drift diagnosis.
          type: string
      additionalProperties: false
    UploadCaptureSettingsPayload:
      description: 'Declared locally, not imported, so the generator emits a flat definition —

        must stay field-for-field equal to `ProfileCaptureSettings` in

        `../../profiles/types.ts`. `profile.http.spec.ts` pins it two ways: an

        `Exact<>` type assertion, and a key-set check against the generated

        `*.body.json` — the artifact that actually decides whether a request 400s.

        All-optional so a partial payload cannot 400, and non-nullable because the

        generator drops the null. Nested definitions get

        `additionalProperties: false`, so **adding a member here is an

        enterprise-first deploy, every time.**'
      type: object
      properties:
        browser:
          description: Raw `--browser` value.
          type: string
        profile:
          description: Raw `--profile` value.
          type: string
        excludeDomains:
          description: Effective merged exclusion list, not just the `--exclude-domain` flags.
          type: array
          items:
            type: string
        onlyDomains:
          description: Normalized `--only-domain` hostnames, deduped and capped — not merged with local config.
          type: array
          items:
            type: string
        keepDomains:
          description: Normalized `--keep-domain` hostnames, same normalization, no merge.
          type: array
          items:
            type: string
        autoFit:
          description: Whether `--auto-fit` was used.
          type: boolean
        passwordStore:
          description: Raw `--password-store` value. Linux only.
          type: string
        cliVersion:
          description: CLI version that produced these settings.
          type: string
      additionalProperties: false
