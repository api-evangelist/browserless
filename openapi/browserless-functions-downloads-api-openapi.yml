components:
  schemas:
    AbortSignal:
      type: object
      properties:
        aborted:
          type: boolean
        onabort:
          anyOf:
          - type: object
            additionalProperties: false
          - type: 'null'
        reason: {}
      additionalProperties: false
      required:
      - aborted
      - onabort
      - reason
    ContextValue:
      anyOf:
      - type: array
        items:
          $ref: '#/components/schemas/ContextValue'
      - type: object
        additionalProperties:
          $ref: '#/components/schemas/ContextValue'
      - type:
        - 'null'
        - string
        - number
        - boolean
    StringRecord:
      type: object
      additionalProperties: false
    ProxyType:
      description: 'The proxy networks the platform can route through. `residential` uses the

        built-in residential vendors; `datacenter` uses the Geonode datacenter

        network (cheaper, billed at a lower per-MB rate).'
      enum:
      - datacenter
      - residential
      type: string
    CDPLaunchOptions:
      type: object
      additionalProperties: {}
      properties:
        args:
          type: array
          items:
            type: string
        defaultViewport:
          type: object
          properties:
            deviceScaleFactor:
              type: number
            hasTouch:
              type: boolean
            height:
              type: number
            isLandscape:
              type: boolean
            isMobile:
              type: boolean
            width:
              type: number
          additionalProperties: false
          required:
          - height
          - width
        devtools:
          type: boolean
        dumpio:
          type: boolean
        headless:
          enum:
          - false
          - shell
          - true
        ignoreDefaultArgs:
          anyOf:
          - type: array
            items:
              type: string
          - type: boolean
        ignoreHTTPSErrors:
          type: boolean
        acceptInsecureCerts:
          type: boolean
        slowMo:
          type: number
        stealth:
          type: boolean
        timeout:
          type: number
        userDataDir:
          type: string
        waitForInitialPage:
          type: boolean
    JSONSchema:
      type: object
      properties:
        code:
          type: string
        context:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/ContextValue'
      additionalProperties: false
      required:
      - code
    PuppeteerLifeCycleEvent:
      enum:
      - domcontentloaded
      - load
      - networkidle0
      - networkidle2
      type: string
    GoToOptions:
      type: object
      properties:
        referer:
          description: 'If provided, it will take preference over the referer header value set by

            {@link Page.setExtraHTTPHeaderspage.setExtraHTTPHeaders()}.'
          type: string
        referrerPolicy:
          description: 'If provided, it will take preference over the referer-policy header value

            set by {@link Page.setExtraHTTPHeaderspage.setExtraHTTPHeaders()}.'
          type: string
        timeout:
          description: 'Maximum wait time in milliseconds. Pass 0 to disable the timeout.


            The default value can be changed by using the

            {@link Page.setDefaultTimeout} or {@link Page.setDefaultNavigationTimeout}

            methods.'
          type: number
        waitUntil:
          description: 'When to consider waiting succeeds. Given an array of event strings, waiting

            is considered to be successful after all events have been fired.'
          anyOf:
          - type: array
            items:
              $ref: '#/components/schemas/PuppeteerLifeCycleEvent'
          - enum:
            - domcontentloaded
            - load
            - networkidle0
            - networkidle2
            type: string
        signal:
          description: A signal object that allows you to cancel the call.
          $ref: '#/components/schemas/AbortSignal'
      additionalProperties: false
  securitySchemes:
    tokenAuth:
      type: apiKey
      in: query
      name: token
      description: Your Browserless API token. Find it on your [Account dashboard](https://www.browserless.io/account).
