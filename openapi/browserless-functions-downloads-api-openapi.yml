openapi: 3.2.0
info:
  title: Browserless Functions & Downloads API
  version: 2.57.0
  description: 'This is the API reference for **Browserless Enterprise and Cloud** deployments. You''ll find endpoints for capturing screenshots and PDFs, scraping content, running custom browser functions, solving CAPTCHAs, bypassing bot detection with stealth browsing, managing authenticated browser profiles, and orchestrating crawls.


    The API includes REST endpoints (JSON in, JSON or binary out), WebSocket connections for direct CDP/Playwright/Puppeteer access, and CDP extensions that expose Browserless-specific commands like `liveURL`, `solveCaptcha`, and `reconnect`. For the open-source container API, see the GitHub repository.


    ## Just Getting Started?


    Check out the Quick Start guide to launch your first session, or explore the BrowserQL IDE for a GraphQL-based automation workflow.


    ## Base URL


    All API requests go to your deployment''s base URL. For Browserless Cloud:


    ```plaintext

    https://production-sfo.browserless.io

    ```


    Self-hosted Enterprise deployments use the host and port where the container is running (default `http://localhost:3000`).


    ## Authentication


    Include your API token as a query parameter on every request:


    ```plaintext

    https://production-sfo.browserless.io/chromium/content?token=YOUR_API_TOKEN

    ```


    Tokens are managed from the Account dashboard. Self-hosted deployments set the token via the `TOKEN` environment variable. See connection details for all authentication options.


    ## Changelog


    For release notes and version history, see the Enterprise Changelog.


    ## Software keys


    Self-hosted Enterprise deployments use time-limited software keys for offline licensing. No external connections or callbacks are required. Keys are cryptographically secure and can''t be reverse engineered. When a key expires, the container exits with a semantic error code.


    To use a software key, set the `KEY` environment variable when running the container:


    ```bash

    docker run -e KEY=your-generated-key browserless/enterprise

    ```'
servers:
- url: https://production-sfo.browserless.io
security:
- tokenAuth: []
tags:
- name: Functions & Downloads
  description: Run custom JavaScript in a browser context and retrieve the resulting files. Use `/function` to execute a Puppeteer or Playwright script server-side, and `/download` to capture binary assets triggered by in-page actions.
  x-displayName: Functions & Downloads
paths:
  /chromium/function:
    post:
      description: 'Executes a Puppeteer or Playwright script in the browser context and returns the result.

        Browserless sets up a blank page, injects your puppeteer code, and runs it.

        You can optionally load external libraries via the "import" module that are meant for browser usage.

        Values returned from the function are checked and an appropriate content-type and response is sent back

        to your HTTP call.


        **Note:** Also available at `/function` as a convenience alias.'
      parameters:
      - in: query
        name: blockAds
        schema:
          description: 'Whether or not to load ad-blocking extensions for the session.

            This currently uses uBlock-Lite and may cause certain sites

            to not load properly.'
          type: boolean
      - in: query
        name: blockAdsInclude
        schema:
          description: Ruleset IDs to load when `blockAds` is enabled, as CSV or JSON-array text.
          type: string
      - in: query
        name: launch
        schema:
          description: 'Launch options, which can be either an object

            of puppeteer.launch options or playwright.launchServer

            options, depending on the API. Must be either JSON

            object, or a base64-encoded JSON object.'
          anyOf:
          - $ref: '#/components/schemas/CDPLaunchOptions'
          - type: string
      - in: query
        name: profile
        schema:
          description: 'Name of an authenticated profile to hydrate into the browser at launch.

            The profile''s cookies, localStorage and IndexedDB are injected via CDP

            before your code runs. No-op in builds without a profile subsystem.'
          type: string
      - in: query
        name: timeout
        schema:
          description: 'Override the system-level timeout for this request.

            Accepts a value in milliseconds.'
          type: number
      - in: query
        name: token
        schema:
          description: The authorization token
          type: string
      - in: query
        name: trackingId
        schema:
          description: Custom session identifier
          type: string
      - in: query
        name: allowedDomains
        schema:
          description: 'Optional per-connection narrowing of the integration''s allowed-domain list.

            Extracted from the JSON `allowedDomains` query parameter. Can only narrow the

            integration''s domains, never widen them.'
          type: array
          items:
            type: string
      - in: query
        name: credentials
        schema:
          $ref: '#/components/schemas/StringRecord'
          description: 'Optional alias → `op://…` reference map for the integration above. Extracted

            from the JSON `credentials` query parameter. References are not secret;

            resolved values are never stored here. Optional — a connection can also pass

            raw `op://…` references straight to Browserless.loadSecret.'
      - in: query
        name: externalProxyServer
        schema:
          description: 'External proxy server URL for user-provided proxies.

            Format: http(s)://[username:password@]host:port

            When set, routes requests through this proxy instead of built-in residential proxies.'
          type: string
      - in: query
        name: integrationId
        schema:
          description: 'Optional 1Password integration id (op_int_…) or label for credential filling on a non-persistent

            connection. Extracted from the `integrationId` query parameter; the persistent

            session path carries the same data on session metadata instead.'
          type: string
      - in: query
        name: proxy
        schema:
          $ref: '#/components/schemas/ProxyType'
          description: 'The type of proxy to use: ''residential'' or ''datacenter''.'
      - in: query
        name: proxyCity
        schema:
          description: 'The city to use for the proxy.


            Available cities: https://production-sfo.browserless.io/proxy/cities?token=YOUR_TOKEN

            Documentation: https://docs.browserless.io/baas/features/proxies#built-in-residential-proxy'
          type: string
      - in: query
        name: proxyCountry
        schema:
          description: 'A two-letter country code for the proxy configuration.


            Supported codes: US, GB, FR, DE, etc.

            Full list: https://docs.browserless.io/bql-schema/types/enums/country-type'
          type: string
      - in: query
        name: proxyLocaleMatch
        schema:
          description: 'Sets the browser''s language to match the proxy''s geographic location.

            Recommended when using proxyCountry to ensure websites render content,

            currency, and formatting in the local language. Default is English (en-US).'
          enum:
          - '0'
          - '1'
          - 'false'
          - 'true'
          type: string
      - in: query
        name: proxyPreset
        schema:
          description: 'A preset code for website-specific proxy routing.

            Maps to specific proxy vendors internally for optimal access to certain websites.

            Only applies to the residential network; the datacenter pool ignores it.

            Format: "px_<identifier>" (e.g., "px_gov01", "px_amazon01")'
          type: string
      - in: query
        name: proxyState
        schema:
          description: The state or province to use for the proxy, whitespace must be replaced with underscores
          type: string
      - in: query
        name: proxySticky
        schema:
          description: Whether or not to use the same IP for all requests. Off by default.
          enum:
          - '0'
          - '1'
          - 'false'
          - 'true'
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JSONSchema'
          application/javascript:
            schema:
              type: string
      responses:
        '200':
          content:
            '*/*':
              schema:
                description: 'Responses are determined by the returned value of the function

                  itself. Binary responses (PDF''s, screenshots) are returned back

                  as binary data, and primitive JavaScript values are returned back

                  by type (HTML data is "text/html", Objects are "application/json")'
                $schema: http://json-schema.org/draft-07/schema#
          description: 'Responses are determined by the returned value of the function

            itself. Binary responses (PDF''s, screenshots) are returned back

            as binary data, and primitive JavaScript values are returned back

            by type (HTML data is "text/html", Objects are "application/json")'
        '400':
          code: 400
          description: The request contains errors or didn't properly encode content.
          message: HTTP/1.1 400 Bad Request
        '401':
          code: 401
          description: The request is missing, or contains bad, authorization credentials.
          message: HTTP/1.1 401 Unauthorized
        '403':
          code: 403
          description: The request targets a destination that is not allowed.
          message: HTTP/1.1 403 Forbidden
        '404':
          code: 404
          description: Resource couldn't be found.
          message: HTTP/1.1 404 Not Found
        '408':
          code: 408
          description: The request took has taken too long to process.
          message: HTTP/1.1 408 Request Timeout
        '429':
          code: 429
          description: Too many requests are currently being processed.
          message: HTTP/1.1 429 Too Many Requests
        '500':
          code: 500
          description: An internal error occurred when handling the request.
          message: HTTP/1.1 500 Internal Server Error
        '503':
          code: 503
          description: Service is unavailable.
          message: HTTP/1.1 503 Service Unavailable
      summary: /chromium/function
      tags:
      - Functions & Downloads
      operationId: postChromiumFunction
      x-operation-id-source: derived
  /chromium/download:
