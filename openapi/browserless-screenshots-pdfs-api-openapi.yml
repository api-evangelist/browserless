      - A0
      - A1
      - A2
      - A3
      - A4
      - A5
      - A6
      - LEDGER
      - LEGAL
      - LETTER
      - Ledger
      - Legal
      - Letter
      - TABLOID
      - Tabloid
      - a0
      - a1
      - a2
      - a3
      - a4
      - a5
      - a6
      - ledger
      - legal
      - letter
      - tabloid
      type: string
    CDPLaunchOptions:
      type: object
      additionalProperties: {}
      properties:
        args:
          type: array
          items:
            type: string
        defaultViewport:
          type: object
          properties:
            deviceScaleFactor:
              type: number
            hasTouch:
              type: boolean
            height:
              type: number
            isLandscape:
              type: boolean
            isMobile:
              type: boolean
            width:
              type: number
