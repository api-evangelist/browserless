                scrollPage:
                  type: boolean
                selector:
                  type: string
                setExtraHTTPHeaders:
                  type: object
                  additionalProperties:
                    type: string
                setJavaScriptEnabled:
                  type: boolean
                url:
                  type: string
                userAgent:
                  type: object
                  properties:
