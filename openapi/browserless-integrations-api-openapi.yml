components:
  schemas:
    InboxCandidate:
      type: object
      properties:
        vault:
          type: string
        item:
          type: string
        label:
          type: string
      additionalProperties: false
      required:
      - item
      - label
      - vault
    AutologinState:
      description: Lifecycle state of an autologin task.
      enum:
      - failed
      - pending
      - running
      - success
      type: string
    OpIntegrationResponse:
      description: 'Public-facing integration response returned by HTTP routes.

        Omits internal fields — never includes token_hash or any token material.'
      type: object
      properties:
        vaults:
          description: Live vault titles, only with includeVaults=true; null when unavailable.
          type: array
          items:
            type: string
        id:
          description: Unique integration identifier.
          type: string
        label:
          description: User-supplied label. Unique per token.
          type: string
        kind:
          $ref: '#/components/schemas/OpIntegrationKind'
          description: 'Integration kind: `service_account` (default) or `connect`.'
        allowedDomains:
          description: Origins this integration is allowed to fill into.
          type: array
          items:
            type: string
        connectUrl:
          description: Connect server URL when kind is `connect`, otherwise null.
          type: string
        expiresAt:
          description: ISO timestamp after which the integration is treated as expired, or null.
          type: string
        lastResolvedAt:
          description: ISO timestamp of the last successful secret resolve, or null if never used.
          type: string
        createdAt:
          description: ISO timestamp of when the integration was created.
          type: string
        updatedAt:
          description: ISO timestamp of the last metadata change.
          type: string
      additionalProperties: false
      required:
      - allowedDomains
      - connectUrl
      - createdAt
      - expiresAt
      - id
      - kind
      - label
      - lastResolvedAt
      - updatedAt
    OpAuditOutcome:
      description: Outcome recorded for a Browserless.loadSecret or saveSecret attempt.
      enum:
      - failure
      - saved
      - success
      type: string
    CDPLaunchOptions:
      type: object
      additionalProperties: {}
      properties:
        args:
          type: array
          items:
            type: string
        defaultViewport:
          type: object
          properties:
            deviceScaleFactor:
              type: number
            hasTouch:
              type: boolean
            height:
              type: number
            isLandscape:
              type: boolean
            isMobile:
              type: boolean
            width:
              type: number
          additionalProperties: false
          required:
          - height
          - width
        devtools:
          type: boolean
        dumpio:
          type: boolean
        headless:
          enum:
          - false
          - shell
          - true
        ignoreDefaultArgs:
          anyOf:
          - type: array
            items:
              type: string
          - type: boolean
        ignoreHTTPSErrors:
          type: boolean
        acceptInsecureCerts:
          type: boolean
        slowMo:
          type: number
        stealth:
          type: boolean
        timeout:
          type: number
        userDataDir:
          type: string
        waitForInitialPage:
          type: boolean
    OpIntegrationKind:
      enum:
      - connect
      - service_account
      type: string
    AutologinDomainResult:
      type: object
      properties:
        origin:
          type: string
        status:
          $ref: '#/components/schemas/AutologinDomainStatus'
        error:
          type: string
        errorCode:
          type: string
        reason:
          type: string
        mfaMethod:
          $ref: '#/components/schemas/MfaMethod'
        mfaSupported:
          type: boolean
      additionalProperties: false
      required:
      - origin
      - status
    AutologinDomainStatus:
      description: 'Per-origin progress/outcome as the agent works through the domain list.

        Live: `pending` (not reached), `active` (currently attempting), `tried`

        (moved past — outcome not yet known). Terminal: `success` | `failed`.'
      enum:
      - active
      - failed
      - pending
      - success
      - tried
      type: string
    MfaMethod:
      enum:
      - email
      - hardware_key
      - passkey
      - push
      - sms
      - totp
      - unknown
      type: string
    BrowserServerOptions:
      type: object
      additionalProperties: {}
      properties:
        args:
          type: array
          items:
            type: string
        chromiumSandbox:
          type: boolean
        devtools:
          type: boolean
        downloadsPath:
          type: string
        env:
          description: 'Environment for the browser process. Honored by both puppeteer.launch and

            playwright.launchServer. Set server-side to give the session its own TMPDIR

            (see generateScratchDir); a caller-supplied value is merged under it, since

            a session must not be able to point its scratch back at the shared temp dir.


            That merge happens on the object handed to `launch` only. It is kept off

            the session''s stored `launchOptions`, which /sessions serves verbatim.'
          $ref: '#/components/schemas/Record_string_string_undefined'
        headless:
          type: boolean
        ignoreDefaultArgs:
          anyOf:
          - type: array
            items:
              type: string
          - type: boolean
        proxy:
          type: object
          properties:
            bypass:
              type: string
            password:
              type: string
            server:
              type: string
            username:
              type: string
          additionalProperties: false
          required:
          - server
        timeout:
          type: number
        tracesDir:
          type: string
    Record_string_string_undefined:
      type: object
      additionalProperties: false
    OpAuditLogResponse:
      description: 'Public-facing audit-log entry returned by the audit HTTP route. Omits

        token_hash — never includes any token material — and carries the credential

        reference plus non-secret target metadata only.'
      type: object
      properties:
        id:
          description: Unique audit-entry identifier.
          type: string
        integrationId:
          description: Integration this credential operation used.
          type: string
        profileId:
          description: Authentication profile associated with the operation, or null.
          type: string
        secretRef:
          description: The alias or op:// reference requested. Never a resolved value.
          type: string
        targetOrigin:
          description: Document origin the fill was attempted on, or null.
          type: string
        targetSelector:
          description: CSS selector supplied by the caller, or null.
          type: string
        targetDescriptor:
          description: Non-secret descriptor of the focused element, or null.
          type: string
        outcome:
          $ref: '#/components/schemas/OpAuditOutcome'
          description: '`success` if filled, `saved` if created, otherwise `failure`.'
        errorCode:
          description: Error code when the outcome is `failure`, otherwise null.
          type: string
        createdAt:
          description: ISO timestamp of the operation.
          type: string
      additionalProperties: false
      required:
      - createdAt
      - errorCode
      - id
      - integrationId
      - outcome
      - profileId
      - secretRef
      - targetDescriptor
      - targetOrigin
      - targetSelector
  securitySchemes:
    tokenAuth:
      type: apiKey
      in: query
      name: token
      description: Your Browserless API token. Find it on your [Account dashboard](https://www.browserless.io/account).
