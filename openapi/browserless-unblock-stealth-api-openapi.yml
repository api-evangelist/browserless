openapi: 3.2.0
info:
  title: Browserless Unblock & Stealth API
  version: 2.57.0
  description: 'This is the API reference for **Browserless Enterprise and Cloud** deployments. You''ll find endpoints for capturing screenshots and PDFs, scraping content, running custom browser functions, solving CAPTCHAs, bypassing bot detection with stealth browsing, managing authenticated browser profiles, and orchestrating crawls.


    The API includes REST endpoints (JSON in, JSON or binary out), WebSocket connections for direct CDP/Playwright/Puppeteer access, and CDP extensions that expose Browserless-specific commands like `liveURL`, `solveCaptcha`, and `reconnect`. For the open-source container API, see the GitHub repository.


    ## Just Getting Started?


    Check out the Quick Start guide to launch your first session, or explore the BrowserQL IDE for a GraphQL-based automation workflow.


    ## Base URL


    All API requests go to your deployment''s base URL. For Browserless Cloud:


    ```plaintext

    https://production-sfo.browserless.io

    ```


    Self-hosted Enterprise deployments use the host and port where the container is running (default `http://localhost:3000`).


    ## Authentication


    Include your API token as a query parameter on every request:


    ```plaintext

    https://production-sfo.browserless.io/chromium/content?token=YOUR_API_TOKEN

    ```


    Tokens are managed from the Account dashboard. Self-hosted deployments set the token via the `TOKEN` environment variable. See connection details for all authentication options.


    ## Changelog


    For release notes and version history, see the Enterprise Changelog.


    ## Software keys


    Self-hosted Enterprise deployments use time-limited software keys for offline licensing. No external connections or callbacks are required. Keys are cryptographically secure and can''t be reverse engineered. When a key expires, the container exits with a semantic error code.


    To use a software key, set the `KEY` environment variable when running the container:


    ```bash

    docker run -e KEY=your-generated-key browserless/enterprise

    ```'
servers:
- url: https://production-sfo.browserless.io
security:
- tokenAuth: []
tags:
- name: Unblock & Stealth
  description: Bypass bot detection and anti-scraping measures. `/unblock` handles aggressive anti-bot challenges end-to-end. The stealth toggle (`/stealth`, `/chromium/stealth`, `/chrome/stealth`) randomizes browser fingerprints for longer-running automation.
  x-displayName: Unblock & Stealth
paths:
  /unblock:
    post:
      description: 'Unblocks the provided URL from being blocked due to bot detection.

        Returns a payload of Cookies, HTML, a base64 encoded screenshot,

        and a "browserWSEndpoint" to allow connecting to the browser when

        specified in the JSON Payload. Only supports CDP or Puppeteer

        like libraries when connecting to the "browserWSEndpoint".


        **Note:** Also available at `/chromium/unblock` as a convenience alias.'
      parameters:
      - in: query
        name: allowedDomains
        schema:
          description: 'Optional per-connection narrowing of the integration''s allowed-domain list.

            Extracted from the JSON `allowedDomains` query parameter. Can only narrow the

            integration''s domains, never widen them.'
          type: array
          items:
            type: string
      - in: query
        name: blockAds
        schema:
          description: 'Whether or not to load ad-blocking extensions for the session.

            This currently uses uBlock-Lite and may cause certain sites

            to not load properly.'
          type: boolean
      - in: query
        name: blockAdsInclude
        schema:
          description: Ruleset IDs to load when `blockAds` is enabled, as CSV or JSON-array text.
          type: string
      - in: query
        name: credentials
        schema:
          $ref: '#/components/schemas/StringRecord'
          description: 'Optional alias → `op://…` reference map for the integration above. Extracted

            from the JSON `credentials` query parameter. References are not secret;

            resolved values are never stored here. Optional — a connection can also pass

            raw `op://…` references straight to Browserless.loadSecret.'
      - in: query
        name: emulationOs
        schema:
          $ref: '#/components/schemas/Platform'
          description: 'OS to emulate: `windows`/`macos`/`linux`/`android`. Omitted → native Linux

            with no device profile; an explicit `linux` still gets one.'
      - in: query
        name: externalProxyServer
        schema:
          description: 'External proxy server URL for user-provided proxies.

            Format: http(s)://[username:password@]host:port

            When set, routes requests through this proxy instead of built-in residential proxies.'
          type: string
      - in: query
        name: integrationId
        schema:
          description: 'Optional 1Password integration id (op_int_…) or label for credential filling on a non-persistent

            connection. Extracted from the `integrationId` query parameter; the persistent

            session path carries the same data on session metadata instead.'
          type: string
      - in: query
        name: launch
        schema:
          description: 'Launch options for the browser, either as a JSON object or a JSON string.

            Includes options like `headless`, `args`, `defaultViewport`, etc.'
          anyOf:
          - $ref: '#/components/schemas/CDPLaunchOptions'
          - type: string
      - in: query
        name: profile
        schema:
          description: 'Name of an authenticated profile to hydrate into the browser at launch.

            The profile''s cookies, localStorage and IndexedDB are injected via CDP

            before your code runs. No-op in builds without a profile subsystem.'
          type: string
      - in: query
        name: proxy
        schema:
          $ref: '#/components/schemas/ProxyType'
          description: 'The type of proxy to use: ''residential'' or ''datacenter''.'
      - in: query
        name: proxyCity
        schema:
          description: 'The city to use for the proxy.


            Available cities: https://production-sfo.browserless.io/proxy/cities?token=YOUR_TOKEN

            Documentation: https://docs.browserless.io/baas/features/proxies#built-in-residential-proxy'
          type: string
      - in: query
        name: proxyCountry
        schema:
          description: 'A two-letter country code for the proxy configuration.


            Supported codes: US, GB, FR, DE, etc.

            Full list: https://docs.browserless.io/bql-schema/types/enums/country-type'
          type: string
      - in: query
        name: proxyLocaleMatch
        schema:
          description: 'Sets the browser''s language to match the proxy''s geographic location.

            Recommended when using proxyCountry to ensure websites render content,

            currency, and formatting in the local language. Default is English (en-US).'
          enum:
          - '0'
          - '1'
          - 'false'
          - 'true'
          type: string
      - in: query
        name: proxyPreset
        schema:
          description: 'A preset code for website-specific proxy routing.

            Maps to specific proxy vendors internally for optimal access to certain websites.

            Only applies to the residential network; the datacenter pool ignores it.

            Format: "px_<identifier>" (e.g., "px_gov01", "px_amazon01")'
          type: string
      - in: query
        name: proxyState
        schema:
          description: The state or province to use for the proxy, whitespace must be replaced with underscores
          type: string
      - in: query
        name: proxySticky
        schema:
          description: Whether or not to use the same IP for all requests. Off by default.
          enum:
          - '0'
          - '1'
          - 'false'
          - 'true'
          type: string
      - in: query
        name: replay
        schema:
          description: 'Records the unblock session for replay (rrweb) and uploads on cleanup, reusing the

            BQL pipeline. Connection-level flag via `?replay=true`. Defaults to false.'
          type: boolean
      - in: query
        name: solveCaptchas
        schema:
          description: 'With `browserWSEndpoint`, persists captcha-solving on the kept-alive session so

            reconnects auto-solve. Connection-level flag via `?solveCaptchas=true`. Defaults false.'
          type: boolean
      - in: query
        name: timeout
        schema:
          description: 'Override the system-level timeout for this request.

            Accepts a value in milliseconds.'
          type: number
      - in: query
        name: token
        schema:
          description: The authorization token
          type: string
      - in: query
        name: trackingId
        schema:
          description: Custom session identifier
          type: string
      requestBody:
        content:
          application/json:
            schema:
              properties:
                bestAttempt:
                  description: 'When true, browserless proceeds when "awaited" events fail or timeout

                    (goto, waitForSelector, and more).'
                  type: boolean
                url:
                  description: The URL of the site you want to unblock.
                  type: string
                browserWSEndpoint:
                  description: 'Whether or not to keep the underlying browser alive and around for

                    future reconnects. Defaults to false.'
                  type: boolean
                cookies:
                  description: Whether or not to to return cookies for the site, defaults to true.
                  type: boolean
                content:
                  description: Whether or not to to return content for the site, defaults to true.
                  type: boolean
                screenshot:
                  description: Whether or not to to return a full-page screenshot for the site, defaults to true.
                  type: boolean
                ttl:
                  description: 'How long to keep the browser alive for re-connection when browserWSEndpoint

                    is requested. Maximum of 30000 (30 seconds).'
                  type: number
                gotoOptions:
                  $ref: '#/components/schemas/GoToOptions'
                  description: An optional goto parameter object for considering when the page is done loading.
                waitForEvent:
                  description: Options for waiting for a specific event to be fired on the page.
                  type: object
                  properties:
                    event:
                      type: string
                    timeout:
                      type: number
                  additionalProperties: false
                  required:
                  - event
                waitForFunction:
                  description: Options for waiting for a JavaScript function to execute.
                  type: object
                  properties:
                    fn:
                      description: The function, or statement, to be evaluated in browser context
                      type: string
                    polling:
                      description: 'An interval at which the pageFunction is executed, defaults to raf.

                        If polling is a number, then it is treated as an interval in milliseconds

                        at which the function would be executed. If polling is a string,

                        then it can be one of the following values: "raf" or "mutation"'
                      type:
                      - string
                      - number
                    timeout:
                      description: 'Maximum time to wait for in milliseconds. Defaults to 30000 (30 seconds).

                        Pass 0 to disable timeout.'
                      type: number
                  additionalProperties: false
                  required:
                  - fn
                waitForSelector:
                  description: Options for waiting for a specific CSS selector to appear on the page.
                  type: object
                  properties:
                    hidden:
                      type: boolean
                    selector:
                      type: string
                    timeout:
                      type: number
                    visible:
                      type: boolean
                  additionalProperties: false
                  required:
                  - selector
                waitForTimeout:
                  description: The amount of time in milliseconds to wait before proceeding.
                  type: number
              type: object
              required:
              - url
              example:
                url: https://docs.browserless.io/
            example:
              bestAttempt: true
              url: string
              browserWSEndpoint: true
              cookies: true
              content: true
              screenshot: true
              ttl: 0
              gotoOptions:
                referer: string
                referrerPolicy: string
                timeout: 0
                waitUntil:
                - domcontentloaded
                signal:
                  aborted: true
                  onabort: {}
                  reason: {}
              waitForEvent:
                event: string
                timeout: 0
              waitForFunction:
                fn: string
                polling: string
                timeout: 0
              waitForSelector:
                hidden: true
                selector: string
                timeout: 0
                visible: true
              waitForTimeout: 0
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  cookies:
                    description: 'A list of cookies which can be used for new connections or for usage elsewhere.

                      Value is "null" when the request body specifies cookies: false.'
                    type: array
                    items:
                      $ref: '#/components/schemas/UnblockCookie'
                  content:
                    description: 'The HTML content of the page once it is passed bot detection.

                      Value is "null" when the request body specifies content: false.'
                    type: string
                  browserWSEndpoint:
                    description: 'The browserWSEndpoint of the response when the POST body contains a

                      browserWSEndpoint: true property'
                    type: string
                  ttl:
                    description: 'Time the browser stays alive until shutdown; zero when browserWSEndpoint: false.

                      Limit is 60000 (60 seconds).'
                    type: number
                  screenshot:
                    description: A base64 encoded JPEG of the of the final site page.
                    type: string
                  solved:
                    description: 'Whether a detected anti-bot challenge was successfully solved during the unblock.

                      False when none was present or a present one could not be solved.'
                    type: boolean
                additionalProperties: false
                required:
                - browserWSEndpoint
                - content
                - cookies
                - screenshot
                - solved
                - ttl
                definitions:
                  UnblockCookie:
                    type: object
                    properties:
                      name:
                        type: string
                      value:
                        type: string
                      domain:
                        type: string
                      path:
                        type: string
                      expires:
                        type: number
                      httpOnly:
                        type: boolean
                      secure:
                        type: boolean
                      sameSite:
                        type: string
                      url:
                        type: string
                    additionalProperties: false
                    required:
                    - domain
                    - expires
                    - httpOnly
                    - name
                    - path
                    - sameSite
                    - secure
                    - url
                    - value
                $schema: http://json-schema.org/draft-07/schema#
        '400':
          code: 400
          description: The request contains errors or didn't properly encode content.
          message: HTTP/1.1 400 Bad Request
        '401':
          code: 401
          description: The request is missing, or contains bad, authorization credentials.
          message: HTTP/1.1 401 Unauthorized
        '403':
          code: 403
          description: The request targets a destination that is not allowed.
          message: HTTP/1.1 403 Forbidden
        '404':
          code: 404
          description: Resource couldn't be found.
          message: HTTP/1.1 404 Not Found
        '408':
          code: 408
          description: The request took has taken too long to process.
          message: HTTP/1.1 408 Request Timeout
        '429':
          code: 429
          description: Too many requests are currently being processed.
          message: HTTP/1.1 429 Too Many Requests
        '500':
          code: 500
          description: An internal error occurred when handling the request.
          message: HTTP/1.1 500 Internal Server Error
        '503':
          code: 503
          description: Service is unavailable.
          message: HTTP/1.1 503 Service Unavailable
      summary: /unblock
      tags:
      - Unblock & Stealth
      operationId: postUnblock
      x-operation-id-source: derived
  /chrome/stealth:
    get:
      description: Launch and connect to Stealthy Chrome with a library like puppeteer or others that work over chrome-devtools-protocol for scraping in a more stealth-like fashion.
      parameters:
      - in: query
        name: allowedDomains
        schema:
          description: 'Optional per-connection narrowing of the integration''s allowed-domain list.

            Extracted from the JSON `allowedDomains` query parameter. Can only narrow the

            integration''s domains, never widen them.'
          type: array
          items:
            type: string
      - in: query
        name: blockAds
        schema:
          description: 'Whether or not to load ad-blocking extensions for the session.

            This currently uses uBlock-Lite and may cause certain sites

            to not load properly.'
          type: boolean
      - in: query
        name: blockAdsInclude
        schema:
          description: Ruleset IDs to load when `blockAds` is enabled, as CSV or JSON-array text.
          type: string
      - in: query
        name: credentials
        schema:
          $ref: '#/components/schemas/StringRecord'
          description: 'Optional alias → `op://…` reference map for the integration above. Extracted

            from the JSON `credentials` query parameter. References are not secret;

            resolved values are never stored here. Optional — a connection can also pass

            raw `op://…` references straight to Browserless.loadSecret.'
      - in: query
        name: deviceScaleFactor
        schema:
          description: 'Device pixel ratio for the desktop screen above (allowed: 1 or 1.25).

            Omit to default to the seeded/profile scale. Ignored for emulationOs=android.'
          type: number
      - in: query
        name: deviceSlot
        schema:
          description: 'Pin this session to one of your identity''s N stable device slots (0-based,

            default N=8). Each slot is one virtual machine: its GPU, screen, cores, memory

            and OS version stay fixed across sessions, so traffic spreads over N machines

            instead of clustering on one. Requires a desktop emulationOs.'
          type: number
      - in: query
        name: emulatedDevice
        schema:
          description: 'Device model for mobile personas (emulationOs=android), e.g. "pixel-8",

            "galaxy-s23". Omit to auto-pick a device seeded per session (stable per

            identity, spread across the fleet); an unknown slug does the same.'
          type: string
      - in: query
        name: emulationOs
        schema:
          $ref: '#/components/schemas/Platform'
          description: 'Spoof OS for full per-platform stealth: windows | macos | linux | android.'
      - in: query
        name: externalProxyServer
        schema:
          description: 'External proxy server URL for user-provided proxies.

            Format: http(s)://[username:password@]host:port

            When set, routes requests through this proxy instead of built-in residential proxies.'
          type: string
      - in: query
        name: integrationId
        schema:
          description: 'Optional 1Password integration id (op_int_…) or label for credential filling on a non-persistent

            connection. Extracted from the `integrationId` query parameter; the persistent

            session path carries the same data on session metadata instead.'
          type: string
      - in: query
        name: integrations
        schema:
          type: string
      - in: query
        name: launch
        schema:
          description: 'Launch options, which can be either an object

            of puppeteer.launch options or playwright.launchServer

            options, depending on the API. Must be either JSON

            object, or a base64-encoded JSON object.'
          anyOf:
          - $ref: '#/components/schemas/CDPLaunchOptions'
          - type: string
      - in: query
        name: profile
        schema:
          description: 'Name of an authenticated profile to hydrate into the browser at launch.

            The profile''s cookies, localStorage and IndexedDB are injected via CDP

            before your code runs. No-op in builds without a profile subsystem.'
          type: string
      - in: query
        name: proxy
        schema:
          $ref: '#/components/schemas/ProxyType'
          description: 'The type of proxy to use: ''residential'' or ''datacenter''.'
      - in: query
        name: proxyCity
        schema:
          description: 'The city to use for the proxy.


            Available cities: https://production-sfo.browserless.io/proxy/cities?token=YOUR_TOKEN

            Documentation: https://docs.browserless.io/baas/features/proxies#built-in-residential-proxy'
          type: string
      - in: query
        name: proxyCountry
        schema:
          description: 'A two-letter country code for the proxy configuration.


            Supported codes: US, GB, FR, DE, etc.

            Full list: https://docs.browserless.io/bql-schema/types/enums/country-type'
          type: string
      - in: query
        name: proxyLocaleMatch
        schema:
          description: 'Sets the browser''s language to match the proxy''s geographic location.

            Recommended when using proxyCountry to ensure websites render content,

            currency, and formatting in the local language. Default is English (en-US).'
          enum:
          - '0'
          - '1'
          - 'false'
          - 'true'
          type: string
      - in: query
        name: proxyPreset
        schema:
          description: 'A preset code for website-specific proxy routing.

            Maps to specific proxy vendors internally for optimal access to certain websites.

            Only applies to the residential network; the datacenter pool ignores it.

            Format: "px_<identifier>" (e.g., "px_gov01", "px_amazon01")'
          type: string
      - in: query
        name: proxyState
        schema:
          description: The state or province to use for the proxy, whitespace must be replaced with underscores
          type: string
      - in: query
        name: proxySticky
        schema:
          description: Whether or not to use the same IP for all requests. Off by default.
          enum:
          - '0'
          - '1'
          - 'false'
          - 'true'
          type: string
      - in: query
        name: record
        schema:
          type: boolean
      - in: query
        name: replay
        schema:
          type: boolean
      - in: query
        name: screen
        schema:
          description: 'Desktop screen resolution as WIDTHxHEIGHT (e.g. ''1920x1080''). Sets the

            reported screen.*, window size and (with deviceScaleFactor) DPR for a

            desktop persona. Omit to auto-pick a screen seeded per session (stable per

            identity, spread across the fleet). Ignored for emulationOs=android.'
          type: string
      - in: query
        name: solveCaptchas
        schema:
          type: boolean
      - in: query
        name: timeout
        schema:
          description: 'Override the system-level timeout for this request.

            Accepts a value in milliseconds.'
          type: number
      - in: query
        name: token
        schema:
          description: The authorization token
          type: string
      - in: query
        name: trackingId
        schema:
          description: Custom session identifier
          type: string
      requestBody:
        content: {}
      responses:
        '101':
          description: Indicates successful WebSocket upgrade.
        '400':
          code: 400
          description: The request contains errors or didn't properly encode content.
          message: HTTP/1.1 400 Bad Request
        '401':
          code: 401
          description: The request is missing, or contains bad, authorization credentials.
          message: HTTP/1.1 401 Unauthorized
        '403':
          code: 403
          description: The request targets a destination that is not allowed.
          message: HTTP/1.1 403 Forbidden
        '404':
          code: 404
          description: Resource couldn't be found.
          message: HTTP/1.1 404 Not Found
        '408':
          code: 408
          description: The request took has taken too long to process.
          message: HTTP/1.1 408 Request Timeout
        '429':
          code: 429
          description: Too many requests are currently being processed.
          message: HTTP/1.1 429 Too Many Requests
        '500':
          code: 500
          description: An internal error occurred when handling the request.
          message: HTTP/1.1 500 Internal Server Error
        '503':
          code: 503
          description: Service is unavailable.
          message: HTTP/1.1 503 Service Unavailable
      summary: /chrome/stealth
      tags:
      - Unblock & Stealth
      operationId: getChromeStealth
      x-operation-id-source: derived
