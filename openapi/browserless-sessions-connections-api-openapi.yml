openapi: 3.2.0
info:
  title: Browserless Sessions & Connections API
  version: 2.57.0
  description: 'This is the API reference for **Browserless Enterprise and Cloud** deployments. You''ll find endpoints for capturing screenshots and PDFs, scraping content, running custom browser functions, solving CAPTCHAs, bypassing bot detection with stealth browsing, managing authenticated browser profiles, and orchestrating crawls.


    The API includes REST endpoints (JSON in, JSON or binary out), WebSocket connections for direct CDP/Playwright/Puppeteer access, and CDP extensions that expose Browserless-specific commands like `liveURL`, `solveCaptcha`, and `reconnect`. For the open-source container API, see the GitHub repository.


    ## Just Getting Started?


    Check out the Quick Start guide to launch your first session, or explore the BrowserQL IDE for a GraphQL-based automation workflow.


    ## Base URL


    All API requests go to your deployment''s base URL. For Browserless Cloud:


    ```plaintext

    https://production-sfo.browserless.io

    ```


    Self-hosted Enterprise deployments use the host and port where the container is running (default `http://localhost:3000`).


    ## Authentication


    Include your API token as a query parameter on every request:


    ```plaintext

    https://production-sfo.browserless.io/chromium/content?token=YOUR_API_TOKEN

    ```


    Tokens are managed from the Account dashboard. Self-hosted deployments set the token via the `TOKEN` environment variable. See connection details for all authentication options.


    ## Changelog


    For release notes and version history, see the Enterprise Changelog.


    ## Software keys


    Self-hosted Enterprise deployments use time-limited software keys for offline licensing. No external connections or callbacks are required. Keys are cryptographically secure and can''t be reverse engineered. When a key expires, the container exits with a semantic error code.


    To use a software key, set the `KEY` environment variable when running the container:


    ```bash

    docker run -e KEY=your-generated-key browserless/enterprise

    ```'
servers:
- url: https://production-sfo.browserless.io
security:
- tokenAuth: []
tags:
- name: Sessions & Connections
  description: Create persistent browser sessions, reconnect to running browsers, and query CDP metadata. `/session` spins up a session that outlives a single WebSocket connection. `/reconnect/:id` reattaches to it later.
  x-displayName: Sessions & Connections
paths:
  /session:
    post:
      description: 'Creates a new browser session with the specified parameters. The session can be used for persistent browser connections

        with well-defined lifetimes and reconnection semantics.'
      parameters: []
      requestBody:
        content:
          application/json:
            schema:
              properties:
                ttl:
                  description: 'The time-to-live (TTL) for the session in milliseconds. Once reached, will be forcefully terminated

                    and all files and processes will be cleaned up. Must be a non-negative number. Hosted Cloud accepts

                    0 as the plan''s maximum retention and rejects values above that maximum.'
                  type: number
                processKeepAlive:
                  description: 'An optional time, in milliseconds, to keep the underlying browser process alive after a connection to the session closes.

                    If a connection happens within the keep-alive window, the browser process will remain running and the session can be reconnected to.

                    If a connection happens after the keep-alive window has expired, a new browser process will be launched for the session, with the prior

                    session data. Defaults to 0 (no keep-alive).'
                  type: number
                stealth:
                  description: Whether or not to enable advanced stealth mode. Defaults to false.
                  type: boolean
                blockAds:
                  description: Whether or not to enable ad-blocking. Defaults to false.
                  type: boolean
                blockAdsInclude:
                  description: 'Restrict blockAds to a specific set of uBlock ruleset ids (comma-separated

                    list or JSON array). Only applies when `blockAds` is true. Fewer rulesets

                    means a faster browser launch under load; omit to load the full default set.'
                  type: string
                headless:
                  description: 'Whether the browser should be launched in headless mode.

                    Ignored if `stealth` is true, defaults to "true".'
                  type: boolean
                defaultViewport:
                  description: 'The default viewport for pages in non-stealth sessions. Ignored when

                    `stealth` is true or `browser` is "stealth". Takes precedence over the

                    connect URL''s launch.defaultViewport, including after a browser restart.'
                  type: object
                  properties:
                    deviceScaleFactor:
                      type: number
                    hasTouch:
                      type: boolean
                    height:
                      type: number
                    isLandscape:
                      type: boolean
                    isMobile:
                      type: boolean
                    width:
                      type: number
                  additionalProperties: false
                  required:
                  - height
                  - width
                args:
                  description: 'An array of command-line arguments to pass to the browser.

                    Defaults to an empty array.'
                  type: array
                  items:
                    type: string
                browser:
                  description: 'The type of browser to use for the session.

                    ''stealth'' uses the Brave browser with advanced anti-detection. Defaults to ''chromium''.'
                  enum:
                  - chrome
                  - chromium
                  - stealth
                  type: string
                url:
                  description: 'The underlying page URL you''re attempting to automate. Some pages may

                    required special handling in order to work correctly or unblock.

                    This is not required, but can be useful or required for certain sites.'
                  type: string
                proxy:
                  description: 'Proxy Parameters for the session if desired.

                    If not specified, the session will use the default network settings.'
                  type: object
                  properties:
                    type:
                      description: 'The type of proxy to use: ''residential'' or ''datacenter''.'
                      enum:
                      - datacenter
                      - residential
                      type: string
                    sticky:
                      description: Whether or not to use the same IP address for all proxied requests. Defaults to true
                      type: boolean
                    country:
                      description: The country to proxy through. Defaults to 'us' or United States
                      type: string
                    city:
                      description: The city to proxy through.
                      type: string
                    state:
                      description: The state to proxy through.
                      type: string
                    preset:
                      description: Preset code for website-specific proxy configurations (e.g., 'px_gov01' for government sites)
                      type: string
                  additionalProperties: false
                replay:
                  description: 'Whether to enable session recording for replay.

                    When true, the session will be recorded and can be replayed later.'
                  type: boolean
                extensions:
                  description: 'An array of extension IDs to load into the browser session.

                    Extensions must be previously uploaded to the browserless extension storage.

                    This allows sessions to start with extensions pre-loaded without specifying

                    them in launch arguments at connection time.'
                  type: array
                  items:
                    type: string
                profile:
                  description: 'Optional name of an authentication profile to use as initial browser state.

                    The profile''s cookies, localStorage, and IndexedDB entries are injected via

                    CDP before your code runs. sessionStorage is intentionally not restored —

                    it is tab-scoped and stale values break OAuth/CSRF flows. Changes during

                    the session do not affect the source profile.'
                  type: string
                integrationId:
                  description: 'Optional 1Password integration id (op_int_…) or label. Browserless.loadSecret can

                    resolve credentials from this integration during the session. Validated at

                    session creation; a missing or expired integration rejects the request.'
                  type: string
                credentials:
                  description: 'Maps caller aliases to 1Password op:// references, e.g.

                    { "password": "op://Prod/GitHub/password" }. Reference strings are not

                    secret; resolved values are never stored on the session.'
                  type: object
                  additionalProperties:
                    type: string
                allowedDomains:
                  description: 'Optionally narrows the integration''s allowed-domain list for this session.

                    Cannot widen it — the effective list is the intersection of the two.'
                  type: array
                  items:
                    type: string
                label:
                  description: 'An optional, caller-supplied label for the session. Stored on the session

                    record for the caller''s own bookkeeping; does not affect behavior.'
                  type: string
              type: object
              required:
              - ttl
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    description: The ID of the session
                    type: string
                  connect:
                    description: The fully-qualified URL to connect CDP-based libraries to the session
                    type: string
                  ttl:
                    description: The total time of life in milliseconds
                    type: number
                  stop:
                    description: The fully qualified URL to stop and remove the session with a DELETE method.
                    type: string
                  browserQL:
                    description: The fully-qualified URL to run BrowserQL queries against the session
                    type: string
                  cloudEndpointId:
                    description: 'The encrypted cloud endpoint ID for the session when ran in the browserless cloud.

                      This is a cloud-specific property and is only present when using browserless cloud.'
                    type: string
                additionalProperties: false
                required:
                - browserQL
                - cloudEndpointId
                - connect
                - id
                - stop
                - ttl
                $schema: http://json-schema.org/draft-07/schema#
        '400':
          code: 400
          description: The request contains errors or didn't properly encode content.
          message: HTTP/1.1 400 Bad Request
        '401':
          code: 401
          description: The request is missing, or contains bad, authorization credentials.
          message: HTTP/1.1 401 Unauthorized
        '403':
          code: 403
          description: The request targets a destination that is not allowed.
          message: HTTP/1.1 403 Forbidden
        '404':
          code: 404
          description: Resource couldn't be found.
          message: HTTP/1.1 404 Not Found
        '408':
          code: 408
          description: The request took has taken too long to process.
          message: HTTP/1.1 408 Request Timeout
        '429':
          code: 429
          description: Too many requests are currently being processed.
          message: HTTP/1.1 429 Too Many Requests
        '500':
          code: 500
          description: An internal error occurred when handling the request.
          message: HTTP/1.1 500 Internal Server Error
        '503':
          code: 503
          description: Service is unavailable.
          message: HTTP/1.1 503 Service Unavailable
      summary: /session
      tags:
      - Sessions & Connections
      operationId: session-create
  /json/new:
    put:
      description: 'Returns a JSON payload that acts as a pass-through to the DevTools /json/new HTTP API in Chromium.

        Browserless mocks this payload so that remote clients can connect to the underlying "webSocketDebuggerUrl"

        which will cause Browserless to start the browser and proxy that request into a blank page.'
      parameters: []
      requestBody:
        content: {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  description:
                    description: The description of the target. Generally the page's title.
                    type: string
                  devtoolsFrontendUrl:
                    description: The fully-qualified URL of the Devtools inspector app.
                    type: string
                  id:
                    description: A Unique Id for the underlying target.
                    type: string
                  title:
                    description: The title of the target. For pages this is the page's title.
                    type: string
                  type:
                    description: The type of target, generally "page" or "background_page".
                    type: string
                  url:
                    description: The current URL the target is consuming or visiting.
                    type: string
                  webSocketDebuggerUrl:
                    description: 'The target or page''s WebSocket Debugger URL. Primarily used for legacy

                      libraries to connect and inspect or remote automate this target.'
                    type: string
                additionalProperties: false
                required:
                - description
                - devtoolsFrontendUrl
                - id
                - title
                - type
                - url
                - webSocketDebuggerUrl
                $schema: http://json-schema.org/draft-07/schema#
        '400':
          code: 400
          description: The request contains errors or didn't properly encode content.
          message: HTTP/1.1 400 Bad Request
        '401':
          code: 401
          description: The request is missing, or contains bad, authorization credentials.
          message: HTTP/1.1 401 Unauthorized
        '403':
          code: 403
          description: The request targets a destination that is not allowed.
          message: HTTP/1.1 403 Forbidden
        '404':
          code: 404
          description: Resource couldn't be found.
          message: HTTP/1.1 404 Not Found
        '408':
          code: 408
          description: The request took has taken too long to process.
          message: HTTP/1.1 408 Request Timeout
        '429':
          code: 429
          description: Too many requests are currently being processed.
          message: HTTP/1.1 429 Too Many Requests
        '500':
          code: 500
          description: An internal error occurred when handling the request.
          message: HTTP/1.1 500 Internal Server Error
        '503':
          code: 503
          description: Service is unavailable.
          message: HTTP/1.1 503 Service Unavailable
      summary: /json/new
      tags:
      - Sessions & Connections
      operationId: putJsonNew
      x-operation-id-source: derived
  /json/version:
    get:
      description: Returns a JSON payload that acts as a pass-through to the DevTools /json/version protocol in Chrome and Chromium.
      parameters: []
      requestBody:
        content: {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  description:
                    description: The description of the target. Generally the page's title.
                    type: string
                  devtoolsFrontendUrl:
                    description: The fully-qualified URL of the Devtools inspector app.
                    type: string
                  id:
                    description: A Unique Id for the underlying target.
                    type: string
                  title:
                    description: The title of the target. For pages this is the page's title.
                    type: string
                  type:
                    description: The type of target, generally "page" or "background_page".
                    type: string
                  url:
                    description: The current URL the target is consuming or visiting.
                    type: string
                  webSocketDebuggerUrl:
                    description: 'The target or page''s WebSocket Debugger URL. Primarily used for legacy

                      libraries to connect and inspect or remote automate this target.'
                    type: string
                additionalProperties: false
                required:
                - description
                - devtoolsFrontendUrl
                - id
                - title
                - type
                - url
                - webSocketDebuggerUrl
                $schema: http://json-schema.org/draft-07/schema#
        '400':
          code: 400
          description: The request contains errors or didn't properly encode content.
          message: HTTP/1.1 400 Bad Request
        '401':
          code: 401
          description: The request is missing, or contains bad, authorization credentials.
          message: HTTP/1.1 401 Unauthorized
        '403':
          code: 403
          description: The request targets a destination that is not allowed.
          message: HTTP/1.1 403 Forbidden
        '404':
          code: 404
          description: Resource couldn't be found.
          message: HTTP/1.1 404 Not Found
        '408':
          code: 408
          description: The request took has taken too long to process.
          message: HTTP/1.1 408 Request Timeout
        '429':
          code: 429
          description: Too many requests are currently being processed.
          message: HTTP/1.1 429 Too Many Requests
        '500':
          code: 500
          description: An internal error occurred when handling the request.
          message: HTTP/1.1 500 Internal Server Error
        '503':
          code: 503
          description: Service is unavailable.
          message: HTTP/1.1 503 Service Unavailable
      summary: /json/version
      tags:
      - Sessions & Connections
      operationId: getJsonVersion
      x-operation-id-source: derived
  /json/protocol:
    get:
      description: Returns Protocol JSON meta-data that Chrome and Chromium come with.
      parameters: []
      requestBody:
        content: {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties: {}
                additionalProperties: true
                $schema: http://json-schema.org/draft-07/schema#
        '400':
          code: 400
          description: The request contains errors or didn't properly encode content.
          message: HTTP/1.1 400 Bad Request
        '401':
          code: 401
          description: The request is missing, or contains bad, authorization credentials.
          message: HTTP/1.1 401 Unauthorized
        '403':
          code: 403
          description: The request targets a destination that is not allowed.
          message: HTTP/1.1 403 Forbidden
        '404':
          code: 404
          description: Resource couldn't be found.
          message: HTTP/1.1 404 Not Found
        '408':
          code: 408
          description: The request took has taken too long to process.
          message: HTTP/1.1 408 Request Timeout
        '429':
          code: 429
          description: Too many requests are currently being processed.
          message: HTTP/1.1 429 Too Many Requests
        '500':
          code: 500
          description: An internal error occurred when handling the request.
          message: HTTP/1.1 500 Internal Server Error
        '503':
          code: 503
          description: Service is unavailable.
          message: HTTP/1.1 503 Service Unavailable
      summary: /json/protocol
      tags:
      - Sessions & Connections
      operationId: getJsonProtocol
      x-operation-id-source: derived
  /session/bql/*:
    post:
      description: '> Executes BrowserQL queries against an existing session.


        BrowserQL is a GraphQL-based query language for browser automation that allows you to interact with web pages using a declarative syntax.

        Queries execute within the context of your existing session, maintaining browser state and session data across multiple operations.'
      parameters:
      - in: query
        name: blockAds
        schema:
          description: 'Whether or not to load ad-blocking extensions for the session.

            This currently uses uBlock-Lite and may cause certain sites

            to not load properly.'
          type: boolean
      - in: query
        name: blockAdsInclude
        schema:
          description: Ruleset IDs to load when `blockAds` is enabled, as CSV or JSON-array text.
          type: string
      - in: query
        name: launch
        schema:
          description: 'Launch options for the browser, either as a JSON object or a JSON string.

            Includes options like `headless`, `args`, `defaultViewport`, etc.

            Must be either JSON object, or a base64-encoded JSON object.'
          anyOf:
          - $ref: '#/components/schemas/CDPLaunchOptions'
          - type: string
      - in: query
        name: profile
        schema:
          description: 'Name of an authenticated profile to hydrate into the browser at launch.

            The profile''s cookies, localStorage and IndexedDB are injected via CDP

            before your code runs. No-op in builds without a profile subsystem.'
          type: string
      - in: query
        name: replay
        schema:
          type: boolean
      - in: query
        name: timeout
        schema:
          description: 'Override the system-level timeout for this request.

            Accepts a value in milliseconds.'
          type: number
      - in: query
        name: token
        schema:
          description: The authorization token
          type: string
      - in: query
        name: trackingId
        schema:
          description: Custom session identifier
          type: string
      - in: query
        name: allowedDomains
        schema:
          description: 'Optional per-connection narrowing of the integration''s allowed-domain list.

            Extracted from the JSON `allowedDomains` query parameter. Can only narrow the

            integration''s domains, never widen them.'
          type: array
          items:
            type: string
      - in: query
        name: credentials
        schema:
          $ref: '#/components/schemas/StringRecord'
          description: 'Optional alias → `op://…` reference map for the integration above. Extracted

            from the JSON `credentials` query parameter. References are not secret;

            resolved values are never stored here. Optional — a connection can also pass

            raw `op://…` references straight to Browserless.loadSecret.'
      - in: query
        name: externalProxyServer
        schema:
          description: 'External proxy server URL for user-provided proxies.

            Format: http(s)://[username:password@]host:port

            When set, routes requests through this proxy instead of built-in residential proxies.'
          type: string
      - in: query
        name: integrationId
        schema:
          description: 'Optional 1Password integration id (op_int_…) or label for credential filling on a non-persistent

            connection. Extracted from the `integrationId` query parameter; the persistent

            session path carries the same data on session metadata instead.'
          type: string
      - in: query
        name: proxy
        schema:
          $ref: '#/components/schemas/ProxyType'
          description: 'The type of proxy to use: ''residential'' or ''datacenter''.'
      - in: query
        name: proxyCity
        schema:
          description: 'The city to use for the proxy.


            Available cities: https://production-sfo.browserless.io/proxy/cities?token=YOUR_TOKEN

            Documentation: https://docs.browserless.io/baas/features/proxies#built-in-residential-proxy'
          type: string
      - in: query
        name: proxyCountry
        schema:
          description: 'A two-letter country code for the proxy configuration.


            Supported codes: US, GB, FR, DE, etc.

            Full list: https://docs.browserless.io/bql-schema/types/enums/country-type'
          type: string
      - in: query
        name: proxyLocaleMatch
        schema:
          description: 'Sets the browser''s language to match the proxy''s geographic location.

            Recommended when using proxyCountry to ensure websites render content,

            currency, and formatting in the local language. Default is English (en-US).'
          enum:
          - '0'
          - '1'
          - 'false'
          - 'true'
          type: string
      - in: query
        name: proxyPreset
        schema:
          description: 'A preset code for website-specific proxy routing.

            Maps to specific proxy vendors internally for optimal access to certain websites.

            Only applies to the residential network; the datacenter pool ignores it.

            Format: "px_<identifier>" (e.g., "px_gov01", "px_amazon01")'
          type: string
      - in: query
        name: proxyState
        schema:
          description: The state or province to use for the proxy, whitespace must be replaced with underscores
          type: string
      - in: query
        name: proxySticky
        schema:
          description: Whether or not to use the same IP for all requests. Off by default.
          enum:
          - '0'
          - '1'
          - 'false'
          - 'true'
          type: string
      requestBody:
        content:
          application/json:
            schema:
              properties:
                query:
                  description: 'The GraphQL query string to execute against the browser session.


                    Example queries:

                    - Get browser info: `query { version browser }`

                    - Navigate and get content: `mutation { goto(url: "https://example.com") { status } title { title } url { url } }`

                    - Fill form and submit: `mutation { goto(url: "https://example.com") { status } type(selector: "input[name=''email'']", text: "user@example.com") { time } click(selector: "button[type=''submit'']") { time } }`

                    - Extract data: `mutation { querySelector(selector: "h1") { innerHTML } querySelectorAll(selector: ".product") { innerHTML className } }`'
                  type: string
                variables:
                  description: 'Variables to pass to the GraphQL query. Useful for dynamic values.


                    Example: `{ "url": "https://example.com", "selector": "h1", "text": "Hello World" }`'
                  type: object
                  additionalProperties: {}
                operationName:
                  description: 'The name of the operation to execute if the query contains multiple operations.

                    Optional - only needed when query has multiple named operations.'
                  type: string
              type: object
              required:
              - query
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/AnyRecord'
                    description: 'The GraphQL response data. Contains the result of the executed query.

                      Structure depends on the specific query executed.


                      Example responses:

                      - Navigation + Title + Element: `{ "goto": { "status": 200 }, "title": { "title": "Example Domain" }, "querySelector": { "innerHTML": "Example Domain" } }`

                      - Multiple elements: `{ "querySelectorAll": [{ "innerHTML": "Item 1" }, { "innerHTML": "Item 2" }] }`

                      - Screenshot: `{ "screenshot": { "data": "base64encodedimage", "type": "png" } }`

                      - PDF: `{ "pdf": { "data": "base64encodedpdf" } }`

                      - System info: `{ "version": "1.0.0", "browser": "Chrome/120.0.0.0" }`

                      - Form interaction: `{ "type": { "success": true }, "click": { "success": true } }`'
                  errors:
                    description: 'Array of GraphQL errors, if any occurred during query execution.

                      Only present when errors exist.'
                    type: array
                    items:
                      type: object
                      properties:
                        message:
                          description: Error message describing what went wrong
                          type: string
                        locations:
                          description: Locations in the query where the error occurred
                          type: array
                          items:
                            type: object
                            properties:
                              line:
                                type: number
                              column:
                                type: number
                            additionalProperties: false
                            required:
                            - column
                            - line
                        path:
                          description: Path to the field that caused the error
                          type: array
                          items:
                            type:
                            - string
                            - number
                      additionalProperties: false
                      required:
                      - message
                additionalProperties: false
                definitions:
                  Record<string,any>:
                    type: object
                    additionalProperties: false
                $schema: http://json-schema.org/draft-07/schema#
        '400':
          code: 400
          description: The request contains errors or didn't properly encode content.
          message: HTTP/1.1 400 Bad Request
        '401':
          code: 401
          description: The request is missing, or contains bad, authorization credentials.
          message: HTTP/1.1 401 Unauthorized
        '403':
          code: 403
          description: The request targets a destination that is not allowed.
          message: HTTP/1.1 403 Forbidden
        '404':
          code: 404
          description: Resource couldn't be found.
          message: HTTP/1.1 404 Not Found
        '408':
          code: 408
          description: The request took has taken too long to process.
          message: HTTP/1.1 408 Request Timeout
        '429':
          code: 429
          description: Too many requests are currently being processed.
          message: HTTP/1.1 429 Too Many Requests
        '500':
          code: 500
          description: An internal error occurred when handling the request.
          message: HTTP/1.1 500 Internal Server Error
        '503':
          code: 503
          description: Service is unavailable.
          message: HTTP/1.1 503 Service Unavailable
      summary: /session/bql/*
      tags:
      - Sessions & Connections
      operationId: postSessionBql*
      x-operation-id-source: derived
  /reconnect/*:
    get:
      description: Reconnect to an existing Chromium or Chrome session with a library like puppeteer or others that work over chrome-devtools-protocol.
      parameters:
      - in: query
        name: blockAds
        schema:
          description: 'Whether or not to load ad-blocking extensions for the session.

            This currently uses uBlock-Lite and may cause certain sites

            to not load properly.'
          type: boolean
      - in: query
        name: blockAdsInclude
        schema:
          description: Ruleset IDs to load when `blockAds` is enabled, as CSV or JSON-array text.
          type: string
      - in: query
        name: integrations
        schema:
          type: string
      - in: query
        name: launch
        schema:
          description: 'Launch options, which can be either an object

            of puppeteer.launch options or playwright.launchServer

            options, depending on the API. Must be either JSON

            object, or a base64-encoded JSON object.'
          anyOf:
          - $ref: '#/components/schemas/CDPLaunchOptions'
          - $ref: '#/components/schemas/BrowserServerOptions'
          - type: string
      - in: query
        name: profile
        schema:
          description: 'Name of an authenticated profile to hydrate into the browser at launch.

            The profile''s cookies, localStorage and IndexedDB are injected via CDP

