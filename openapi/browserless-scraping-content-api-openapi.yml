  /smart-scrape:
    post:
      description: Intelligently scrapes a URL using cascading strategies (HTTP fetch, proxy, headless browser, etc).
      parameters:
      - in: query
        name: emulationOs
        schema:
          $ref: '#/components/schemas/Platform'
          description: 'OS to emulate: `windows`/`macos`/`linux`/`android`. Omitted → native Linux

            with no device profile; an explicit `linux` still gets one.'
      - in: query
        name: profile
        schema:
          description: 'Optional name of an authentication profile to hydrate into the browser

            before scraping. The profile''s cookies, localStorage, and IndexedDB

            entries are loaded into the session before navigation. Forces the

            browser strategy.'
          type: string
      - in: query
        name: timeout
        schema:
          description: The timeout for the scrape operation in milliseconds
          type: number
      - in: query
        name: token
        schema:
          description: The API token for authenticating the request. Can also be provided in the `Authorization` header as a Bearer token. If both are provided, the `Authorization` header takes precedence. If no token is provided, the route will attempt to authenticate the request using any legacy authentication methods (e.g. cookie-based sessions) before rejecting the request as unauthorized.
          type: string
      - in: query
        name: allowedDomains
        schema:
          description: 'Optional per-connection narrowing of the integration''s allowed-domain list.

            Extracted from the JSON `allowedDomains` query parameter. Can only narrow the

            integration''s domains, never widen them.'
          type: array
          items:
            type: string
      - in: query
        name: credentials
        schema:
          $ref: '#/components/schemas/StringRecord'
          description: 'Optional alias → `op://…` reference map for the integration above. Extracted

            from the JSON `credentials` query parameter. References are not secret;

            resolved values are never stored here. Optional — a connection can also pass

            raw `op://…` references straight to Browserless.loadSecret.'
      - in: query
        name: externalProxyServer
        schema:
          description: 'External proxy server URL for user-provided proxies.

            Format: http(s)://[username:password@]host:port

            When set, routes requests through this proxy instead of built-in residential proxies.'
          type: string
      - in: query
        name: integrationId
        schema:
          description: 'Optional 1Password integration id (op_int_…) or label for credential filling on a non-persistent

            connection. Extracted from the `integrationId` query parameter; the persistent

            session path carries the same data on session metadata instead.'
          type: string
      - in: query
        name: proxy
        schema:
          $ref: '#/components/schemas/ProxyType'
          description: 'The type of proxy to use: ''residential'' or ''datacenter''.'
      - in: query
        name: proxyCity
        schema:
          description: 'The city to use for the proxy.


            Available cities: https://production-sfo.browserless.io/proxy/cities?token=YOUR_TOKEN

            Documentation: https://docs.browserless.io/baas/features/proxies#built-in-residential-proxy'
          type: string
      - in: query
        name: proxyCountry
        schema:
          description: 'A two-letter country code for the proxy configuration.


            Supported codes: US, GB, FR, DE, etc.

            Full list: https://docs.browserless.io/bql-schema/types/enums/country-type'
          type: string
      - in: query
        name: proxyLocaleMatch
        schema:
          description: 'Sets the browser''s language to match the proxy''s geographic location.

            Recommended when using proxyCountry to ensure websites render content,

            currency, and formatting in the local language. Default is English (en-US).'
          enum:
          - '0'
          - '1'
          - 'false'
          - 'true'
          type: string
      - in: query
        name: proxyPreset
        schema:
          description: 'A preset code for website-specific proxy routing.

            Maps to specific proxy vendors internally for optimal access to certain websites.

            Only applies to the residential network; the datacenter pool ignores it.

            Format: "px_<identifier>" (e.g., "px_gov01", "px_amazon01")'
          type: string
      - in: query
        name: proxyState
        schema:
          description: The state or province to use for the proxy, whitespace must be replaced with underscores
          type: string
      - in: query
        name: proxySticky
        schema:
          description: Whether or not to use the same IP for all requests. Off by default.
          enum:
          - '0'
          - '1'
          - 'false'
          - 'true'
          type: string
      requestBody:
        content:
          application/json:
            schema:
              properties:
                url:
                  description: The URL to scrape. Must be an http or https URL.
                  type: string
                formats:
                  description: 'Output formats to include in the response. Accepts an array of format

                    strings such as `["markdown", "screenshot"]`. When `screenshot` or `pdf`

                    is included, a browser strategy is forced.

                    Mirrors the Firecrawl "formats" convention.


                    - `markdown`   – page content converted to markdown

                    - `html`       – cleaned HTML (returned by default in `content`, this is a no-op convenience value)

                    - `rawText`    – DOM text with script, style, and noscript elements removed and whitespace collapsed; PDF targets return extracted text

                    - `screenshot` – full-page screenshot as base64-encoded PNG (forces browser strategy)

                    - `pdf`        – PDF of the page as base64-encoded string (forces browser strategy)

                    - `links`      – list of links extracted from the page'
                  default:
                  - html
                  type: array
                  items:
                    enum:
                    - html
                    - links
                    - markdown
                    - pdf
                    - rawText
                    - screenshot
                    type: string
                actions:
                  description: 'Browser actions to run in order before the final page is captured. The

                    supported action types are `wait`, `click`, `write`, `scroll`, `scrape`,

                    and `executeJavascript`. A maximum of 20 actions is allowed. Detailed,

                    index-aware validation is performed by the route so the generated schema

                    intentionally leaves each array entry permissive.


                    - `wait` accepts exactly one of `milliseconds` or `selector`

                    - `click` accepts a non-empty `selector`

                    - `write` accepts a non-empty `selector` and string `text`

                    - `scroll` optionally accepts a `selector`

                    - `scrape` captures the current page URL and HTML

                    - `executeJavascript` accepts a non-empty `script` up to 10,000 characters


                    `wait`, `click`, `write`, `scroll`, and `executeJavascript` may include a

                    positive `timeout` of at most 30,000 milliseconds (default 10,000).

                    Every action and the final page settle share the request timeout budget.


                    An empty array is accepted as a no-op. Use a trailing newline in

                    `write.text` to submit a form. Screenshots and PDFs are requested through

                    top-level `formats` and capture the final page after all actions run.'
                  maxItems: 20
                  type: array
                  items: {}
                proxy:
                  description: 'The proxy network to route the scrape through. Defaults to `residential`.

                    Use `datacenter` for the cheaper datacenter pool.'
                  enum:
                  - datacenter
                  - residential
                  type: string
                onlyMainContent:
                  description: 'For HTML webpages, extract the main article content, removing navigation,

                    headers, footers, sidebars and other boilerplate from DOM-derived outputs.

                    Parsed JSON and PDF content are unchanged. Unlike Firecrawl, this defaults

                    to false; when enabled, the HTML format contains the extracted HTML.'
                  default: false
                  type: boolean
                includeTags:
                  description: 'CSS selectors to keep in HTML webpage outputs. Malformed entries are

                    ignored; if no selector matches, unfiltered content is returned. Mutually

                    exclusive with excludeTags and onlyMainContent.'
                  maxItems: 100
                  type: array
                  items:
                    type: string
                excludeTags:
                  description: 'CSS selectors to remove from HTML webpage outputs. Malformed entries are

                    ignored. Mutually exclusive with includeTags.'
                  maxItems: 100
                  type: array
                  items:
                    type: string
                headers:
                  description: 'Custom request headers sent to the target. host, authorization,

                    proxy-authorization, cookie, set-cookie, x-forwarded-for, x-real-ip, and

                    forwarded are removed.'
                  type: object
                  additionalProperties:
                    type: string
                waitFor:
                  description: 'Milliseconds to wait after page load. Clamped to [0, 30000]; positive

                    values force a browser strategy.'
                  default: 0
                  type: number
                strategyCache:
                  description: 'Whether to use and update the remembered winning strategy for this host.

                    Defaults to `true`. Set to `false` to bypass both reads and writes for this

                    request.'
                  default: true
                  type: boolean
              type: object
              required:
              - url
              example:
                url: https://docs.browserless.io/
            example:
              url: string
              formats:
              - html
              - links
              - screenshot
              proxy: datacenter
              actions:
              - type: click
                selector: button[data-accept-cookies]
              - type: wait
                selector: main[data-ready]
                timeout: 10000
              - type: scroll
                selector: '#featured-product'
              - type: scrape
      responses:
        '200':
          content:
            application/json:
              schema:
                description: An HTML payload of the scraped page content.
                type: object
                properties:
                  ok:
                    description: Whether the scrape was successful or not.
                    type: boolean
                  statusCode:
                    description: The HTTP status code of the response, or null if the scrape failed before an HTTP response was received (e.g. due to a network error or captcha).
                    type: number
                  content:
                    description: The content of the scraped page. This is extracted text for PDF targets, a string for HTML content, or a parsed object for JSON. Will be null if the scrape was unsuccessful.
                    anyOf:
                    - $ref: '#/components/schemas/AnyRecord'
                    - type: string
                  contentType:
                    description: The content type returned by the target, or null if the scrape was unsuccessful or unavailable. JSON content is parsed into an object; PDF content is extracted into text.
                    type: string
                  headers:
                    $ref: '#/components/schemas/StringRecord'
                    description: The HTTP response headers returned by the site, or an empty object if unavailable.
                  strategy:
                    description: The strategy that ultimately succeeded in scraping the page, or the strategy that was being attempted when the scrape failed.
                    type: string
                  attempted:
                    description: The strategies that were attempted during the scrape, in order.
                    type: array
                    items:
                      type: string
                  message:
                    description: An error message describing why the scrape failed, or null if the scrape was successful.
                    type: string
                  screenshot:
                    description: 'A base64-encoded full-page PNG screenshot, present when `"screenshot"` is in

                      `formats`. On a successful scrape this is the scraped page; on a captcha /

                      anti-bot failure (`ok:false`) it is a best-effort debug capture of the

                      blocking page. Null otherwise.'
                    type: string
                  pdf:
                    description: A base64-encoded PDF of the page, present when `"pdf"` is in `formats` and the scrape succeeded.
                    type: string
                  markdown:
                    description: The page content converted to markdown, present when `"markdown"` is in `formats` and the scrape succeeded. For PDF targets, this is extracted page text joined with blank lines.
                    type: string
                  links:
                    description: A list of links found on the page, present when `"links"` is in `formats` and the scrape succeeded.
                    type: array
                    items:
                      type: string
                  actions:
                    description: 'Values captured by `scrape` and `executeJavascript` actions, or null when

                      actions were omitted, empty, or the scrape failed.'
                    type:
                    - object
                    - 'null'
                    properties:
                      scrapes:
                        type: array
                        items:
                          type: object
                          properties:
                            url:
                              type: string
                            html:
                              type: string
                          additionalProperties: false
                          required:
                          - html
                          - url
                      javascriptReturns:
                        type: array
                        items:
                          type: object
                          properties:
                            type:
                              type: string
                            value:
                              type:
                              - string
                              - 'null'
                          additionalProperties: false
                          required:
                          - type
                          - value
                    additionalProperties: false
                    required:
                    - javascriptReturns
                    - scrapes
                  rawText:
                    description: DOM text with scripts/styles removed and whitespace collapsed, or extracted PDF text.
                    type: string
                  metadata:
                    description: Page metadata on success, or null when scraping fails.
                    type: object
                    properties:
                      title:
                        type: string
                      description:
                        type: string
                      language:
                        type: string
                      sourceURL:
                        type: string
                      statusCode:
                        type: number
                    additionalProperties: false
                    required:
                    - description
                    - language
                    - sourceURL
                    - statusCode
                    - title
                additionalProperties: false
                required:
                - actions
                - attempted
                - content
                - contentType
                - headers
                - links
                - markdown
                - message
                - metadata
                - ok
                - pdf
                - rawText
                - screenshot
                - statusCode
                - strategy
                definitions:
                  Record<string,unknown>:
                    type: object
                    additionalProperties: false
                  Record<string,string>:
                    type: object
                    additionalProperties: false
                $schema: http://json-schema.org/draft-07/schema#
          description: An HTML payload of the scraped page content.
        '400':
          code: 400
          description: The request contains errors or didn't properly encode content.
          message: HTTP/1.1 400 Bad Request
        '401':
          code: 401
          description: The request is missing, or contains bad, authorization credentials.
