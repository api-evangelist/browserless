      - left
      - text
      - top
      - width
    Protocol.Emulation.UserAgentBrandVersion:
      description: Used to specify User Agent Client Hints to emulate. See https://wicg.github.io/ua-client-hints
      type: object
      properties:
        brand:
          type: string
        version:
          type: string
      additionalProperties: false
      required:
      - brand
