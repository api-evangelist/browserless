          $ref: '#/components/schemas/ProxyType'
          description: 'The type of proxy to use: ''residential'' or ''datacenter''.'
      - in: query
        name: proxyCity
        schema:
          description: 'The city to use for the proxy.


            Available cities: https://production-sfo.browserless.io/proxy/cities?token=YOUR_TOKEN

            Documentation: https://docs.browserless.io/baas/features/proxies#built-in-residential-proxy'
          type: string
      - in: query
        name: proxyCountry
        schema:
          description: 'A two-letter country code for the proxy configuration.


            Supported codes: US, GB, FR, DE, etc.

            Full list: https://docs.browserless.io/bql-schema/types/enums/country-type'
          type: string
      - in: query
        name: proxyLocaleMatch
        schema:
          description: 'Sets the browser''s language to match the proxy''s geographic location.

            Recommended when using proxyCountry to ensure websites render content,

            currency, and formatting in the local language. Default is English (en-US).'
          enum:
          - '0'
          - '1'
          - 'false'
          - 'true'
          type: string
      - in: query
        name: proxyPreset
        schema:
          description: 'A preset code for website-specific proxy routing.

            Maps to specific proxy vendors internally for optimal access to certain websites.

            Only applies to the residential network; the datacenter pool ignores it.

            Format: "px_<identifier>" (e.g., "px_gov01", "px_amazon01")'
          type: string
      - in: query
        name: proxyState
        schema:
          description: The state or province to use for the proxy, whitespace must be replaced with underscores
          type: string
      - in: query
        name: proxySticky
        schema:
          description: Whether or not to use the same IP for all requests. Off by default.
          enum:
          - '0'
          - '1'
          - 'false'
          - 'true'
          type: string
      - in: query
        name: replay
        schema:
          type: boolean
      - in: query
        name: screen
        schema:
          description: 'Desktop screen resolution as WIDTHxHEIGHT (e.g. ''1920x1080''). Sets the

            reported screen.*, window size and (with deviceScaleFactor) DPR for a

            desktop persona. Omit to auto-pick a screen seeded per session (stable per

            identity, spread across the fleet). Ignored for emulationOs=android.'
          type: string
      - in: query
        name: timeout
        schema:
          description: 'Override the system-level timeout for this request.

            Accepts a value in milliseconds.'
          type: number
      - in: query
        name: token
        schema:
          description: The authorization token
          type: string
      - in: query
        name: trackingId
        schema:
          description: Custom session identifier
          type: string
      requestBody:
        content: {}
      responses:
        '101':
          description: Indicates successful WebSocket upgrade.
        '400':
          code: 400
          description: The request contains errors or didn't properly encode content.
          message: HTTP/1.1 400 Bad Request
        '401':
          code: 401
          description: The request is missing, or contains bad, authorization credentials.
          message: HTTP/1.1 401 Unauthorized
        '403':
          code: 403
          description: The request targets a destination that is not allowed.
          message: HTTP/1.1 403 Forbidden
        '404':
          code: 404
          description: Resource couldn't be found.
          message: HTTP/1.1 404 Not Found
        '408':
          code: 408
          description: The request took has taken too long to process.
          message: HTTP/1.1 408 Request Timeout
        '429':
          code: 429
          description: Too many requests are currently being processed.
          message: HTTP/1.1 429 Too Many Requests
        '500':
          code: 500
          description: An internal error occurred when handling the request.
          message: HTTP/1.1 500 Internal Server Error
        '503':
          code: 503
          description: Service is unavailable.
          message: HTTP/1.1 503 Service Unavailable
      summary: /chrome/bql?(/*)
      tags:
      - Chrome (licensed build)
      operationId: chrome-bql-connect
components:
  schemas:
    BrowserServerOptions:
      type: object
      additionalProperties: {}
      properties:
        args:
          type: array
          items:
            type: string
        chromiumSandbox:
          type: boolean
        devtools:
          type: boolean
        downloadsPath:
          type: string
        env:
          description: 'Environment for the browser process. Honored by both puppeteer.launch and

            playwright.launchServer. Set server-side to give the session its own TMPDIR

            (see generateScratchDir); a caller-supplied value is merged under it, since

            a session must not be able to point its scratch back at the shared temp dir.


            That merge happens on the object handed to `launch` only. It is kept off

            the session''s stored `launchOptions`, which /sessions serves verbatim.'
          $ref: '#/components/schemas/Record_string_string_undefined'
        headless:
          type: boolean
        ignoreDefaultArgs:
          anyOf:
          - type: array
            items:
              type: string
          - type: boolean
        proxy:
          type: object
          properties:
            bypass:
              type: string
            password:
              type: string
            server:
              type: string
            username:
              type: string
          additionalProperties: false
          required:
          - server
        timeout:
          type: number
        tracesDir:
          type: string
    UnblockCookie:
      type: object
      properties:
        name:
          type: string
        value:
          type: string
        domain:
          type: string
        path:
          type: string
        expires:
          type: number
        httpOnly:
          type: boolean
        secure:
          type: boolean
        sameSite:
          type: string
        url:
          type: string
      additionalProperties: false
      required:
      - domain
      - expires
      - httpOnly
      - name
      - path
      - sameSite
      - secure
      - url
      - value
    JSONSchema:
      type: object
      properties:
        code:
          type: string
        context:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/ContextValue'
      additionalProperties: false
      required:
      - code
    PuppeteerLifeCycleEvent:
      enum:
      - domcontentloaded
      - load
      - networkidle0
      - networkidle2
      type: string
    GoToOptions:
      type: object
      properties:
        referer:
          description: 'If provided, it will take preference over the referer header value set by

            {@link Page.setExtraHTTPHeaderspage.setExtraHTTPHeaders()}.'
          type: string
        referrerPolicy:
          description: 'If provided, it will take preference over the referer-policy header value

            set by {@link Page.setExtraHTTPHeaderspage.setExtraHTTPHeaders()}.'
          type: string
        timeout:
          description: 'Maximum wait time in milliseconds. Pass 0 to disable the timeout.


            The default value can be changed by using the

            {@link Page.setDefaultTimeout} or {@link Page.setDefaultNavigationTimeout}

            methods.'
          type: number
        waitUntil:
          description: 'When to consider waiting succeeds. Given an array of event strings, waiting

            is considered to be successful after all events have been fired.'
          anyOf:
          - type: array
            items:
              $ref: '#/components/schemas/PuppeteerLifeCycleEvent'
          - enum:
            - domcontentloaded
            - load
            - networkidle0
            - networkidle2
            type: string
        signal:
          description: A signal object that allows you to cancel the call.
          $ref: '#/components/schemas/AbortSignal'
      additionalProperties: false
    CookiePriority:
      description: 'Represents the cookie''s ''Priority'' status:

        https://tools.ietf.org/html/draft-west-cookie-priority-00'
      enum:
      - High
      - Low
      - Medium
      type: string
    ScrapeElementResult:
      type: object
      properties:
        attributes:
          type: array
          items:
            type: object
            properties:
              name:
                type: string
              value:
                type: string
            additionalProperties: false
            required:
            - name
            - value
        height:
          type: number
        html:
          type: string
        left:
          type: number
        text:
