      - in: query
        name: proxyLocaleMatch
        schema:
          description: 'Sets the browser''s language to match the proxy''s geographic location.

            Recommended when using proxyCountry to ensure websites render content,

            currency, and formatting in the local language. Default is English (en-US).'
          enum:
          - '0'
          - '1'
          - 'false'
          - 'true'
          type: string
      - in: query
        name: proxyPreset
        schema:
          description: 'A preset code for website-specific proxy routing.

            Maps to specific proxy vendors internally for optimal access to certain websites.

            Only applies to the residential network; the datacenter pool ignores it.

            Format: "px_<identifier>" (e.g., "px_gov01", "px_amazon01")'
          type: string
      - in: query
        name: proxyState
        schema:
          description: The state or province to use for the proxy, whitespace must be replaced with underscores
          type: string
      - in: query
        name: proxySticky
        schema:
          description: Whether or not to use the same IP for all requests. Off by default.
          enum:
          - '0'
          - '1'
          - 'false'
          - 'true'
          type: string
      requestBody:
        content: {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    description: Run ID.
                    type: string
                  status:
                    $ref: '#/components/schemas/AgentRunStatus'
                    description: Run status.
                  humanRequest:
                    $ref: '#/components/schemas/AgentHumanRequestView'
                    description: Present while the run waits for a human, and with its outcome afterwards.
                  data:
                    description: The latest turn's result, shaped by `responseSchema` when one was given.
                  error:
                    description: The latest turn's error message, or `null`.
                    type: string
                  steps:
                    description: Step rationales for the latest turn.
                    type: array
                    items:
                      type: string
                  html:
                    description: Requested page HTML, or `null`.
                    type: string
                  markdown:
                    description: Requested page Markdown, or `null`.
                    type: string
                  links:
                    description: Requested links extracted from the page, or `null`.
                    type: array
                    items:
                      type: string
                  screenshot:
                    description: Requested viewport PNG encoded as base64, or `null`.
                    type: string
                  formatErrors:
                    description: Present only for missing requested captures; maps format names to reason codes.
                    type: object
                    properties:
                      html:
                        $ref: '#/components/schemas/AgentFormatError'
                      markdown:
                        $ref: '#/components/schemas/AgentFormatError'
                      links:
                        $ref: '#/components/schemas/AgentFormatError'
                      screenshot:
                        $ref: '#/components/schemas/AgentFormatError'
                    additionalProperties: false
                  replayError:
                    description: 'Present only when `replay: true` was requested and the run couldn''t provision a recordable session.'
                    type: string
                    const: session_unavailable
                  turns:
                    description: The turn transcript.
                    type: array
                    items:
                      $ref: '#/components/schemas/AgentTurnView'
                  created_at:
                    description: ISO 8601 timestamp when the run was created.
                    type: string
                  completed_at:
                    description: ISO 8601 timestamp when the run finished, or `null` while active.
                    type: string
                  expires_at:
                    description: ISO 8601 timestamp when the run's results expire, or `null`.
                    type: string
                additionalProperties: false
                required:
                - completed_at
                - created_at
                - data
                - error
                - expires_at
                - html
                - id
                - links
                - markdown
                - screenshot
                - status
                - steps
                - turns
                definitions:
                  AgentRunStatus:
                    enum:
                    - capped
                    - failed
                    - needs_human
                    - pending
                    - running
                    - stopped
                    - succeeded
                    - timed_out
                    type: string
                  AgentHumanRequestView:
                    type: object
                    properties:
                      reason:
                        description: Why the agent needs a human.
                        enum:
                        - login_wall
                        - step_up_mfa
                        type: string
                      instructions:
                        description: What the human should do.
                        type: string
                      liveURL:
                        description: Live URL where the human completes the step.
                        type: string
                      expiresAt:
                        description: ISO 8601 timestamp when the handoff expires.
                        type: string
                      outcome:
                        description: How the handoff ended.
                        enum:
                        - closed
                        - expired
                        - resumed
                        - stopped
                        - userFailed
                        type: string
                    additionalProperties: false
                    required:
                    - reason
                  AgentFormatError:
                    enum:
                    - blocked_saved_credentials
                    - capture_failed
                    - not_captured
                    - session_unavailable
                    - too_large
                    type: string
                  AgentTurnView:
                    type: object
                    properties:
                      turnId:
                        description: Turn ID.
                        type: string
                      query:
                        description: The task submitted for this turn.
                        type: string
                      status:
                        $ref: '#/components/schemas/AgentRunStatus'
                        description: Turn status.
                      data:
                        description: The turn's result, same shape as the top-level `data`.
                      steps:
                        description: Step rationales for this turn.
                        type: array
                        items:
                          type: string
                      units:
                        description: 'Units derived from the model tokens this turn consumed. Informational only: runs are billed for browser time.'
                        type: number
                      replayError:
                        description: 'Present only when `replay: true` was requested and the run couldn''t provision a recordable session for this turn.'
                        type: string
                        const: session_unavailable
                    additionalProperties: false
                    required:
                    - data
                    - query
                    - status
                    - steps
                    - turnId
                    - units
                $schema: http://json-schema.org/draft-07/schema#
        '400':
          code: 400
          description: The request contains errors or didn't properly encode content.
          message: HTTP/1.1 400 Bad Request
        '401':
          code: 401
          description: The request is missing, or contains bad, authorization credentials.
          message: HTTP/1.1 401 Unauthorized
        '403':
          code: 403
          description: The request targets a destination that is not allowed.
          message: HTTP/1.1 403 Forbidden
        '404':
          code: 404
          description: Resource couldn't be found.
          message: HTTP/1.1 404 Not Found
        '408':
          code: 408
          description: The request took has taken too long to process.
          message: HTTP/1.1 408 Request Timeout
        '429':
          code: 429
          description: Too many requests are currently being processed.
          message: HTTP/1.1 429 Too Many Requests
        '500':
