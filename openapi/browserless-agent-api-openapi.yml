        schema:
          description: The state or province to use for the proxy, whitespace must be replaced with underscores
          type: string
      - in: query
        name: proxySticky
        schema:
          description: Whether or not to use the same IP for all requests. Off by default.
          enum:
          - '0'
          - '1'
          - 'false'
          - 'true'
          type: string
      requestBody:
        content:
          application/json:
            schema:
              properties:
                query:
                  description: Natural-language task for the agent. Minimum 10 characters.
                  type: string
                timeout:
                  description: Per-turn timeout in ms, clamped to [10000, 900000] (15-min hard cap).
                  type: number
                onHumanNeeded:
                  description: 'Pause for human login/MFA in the same session. Default: fail. Does not extend timeout.'
                  enum:
                  - fail
                  - pause
                  type: string
                webhook:
                  description: Optional webhook for terminal states and human handoffs.
                  type: object
                  properties:
                    url:
                      type: string
                    events:
                      type: array
                      items:
                        enum:
                        - failed
                        - needs_human
                        - succeeded
                        type: string
                  additionalProperties: false
                  required:
                  - url
                responseSchema:
                  description: Best-effort JSON schema for the agent's final answer.
                  type: object
                  properties: {}
                  additionalProperties: true
                maxSteps:
                  description: Soft cap on browser tool calls. Default 60, hard cap 90.
                  type: number
                allowedDomains:
                  description: Navigation allowlist.
                  type: array
                  items:
                    type: string
                startUrl:
                  description: First navigation target.
                  type: string
                proxy:
                  description: 'Route browsing through a residential or datacenter proxy. Best-effort like

                    the other hints below: injected into the agent''s prompt, not enforced.'
                  enum:
                  - datacenter
                  - residential
                  type: string
                proxyCountry:
                  description: Two-letter country code for the proxy exit (e.g. `US`).
                  type: string
                stealth:
                  description: Ask the agent to use stealth / anti-bot-detection mode.
                  type: boolean
                solveCaptchas:
                  description: Ask the agent to solve CAPTCHAs it encounters.
                  type: boolean
                profile:
                  description: Name of a saved authentication profile to reuse.
                  type: string
                replay:
                  description: 'Record the run as a session replay, viewable in the account dashboard.

                    If the run can''t provision a recordable browser session (for example, at

                    your concurrent-browser limit), it completes unrecorded and the result and

                    webhook include `replayError: "session_unavailable"`.'
                  type: boolean
                formats:
                  description: 'Page captures to return with the result, taken from the agent''s current

                    tab when the run ends. Omit for none.'
                  type: array
                  items:
                    enum:
                    - html
                    - links
                    - markdown
                    - screenshot
                    type: string
              type: object
              required:
              - query
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                  status:
                    type: string
                additionalProperties: false
                required:
                - id
                - status
                $schema: http://json-schema.org/draft-07/schema#
        '400':
          code: 400
          description: The request contains errors or didn't properly encode content.
          message: HTTP/1.1 400 Bad Request
        '401':
          code: 401
          description: The request is missing, or contains bad, authorization credentials.
          message: HTTP/1.1 401 Unauthorized
        '403':
          code: 403
          description: The request targets a destination that is not allowed.
          message: HTTP/1.1 403 Forbidden
        '404':
          code: 404
          description: Resource couldn't be found.
          message: HTTP/1.1 404 Not Found
        '408':
          code: 408
          description: The request took has taken too long to process.
          message: HTTP/1.1 408 Request Timeout
        '429':
          code: 429
          description: Too many requests are currently being processed.
          message: HTTP/1.1 429 Too Many Requests
        '500':
          code: 500
          description: An internal error occurred when handling the request.
          message: HTTP/1.1 500 Internal Server Error
        '503':
          code: 503
          description: Service is unavailable.
          message: HTTP/1.1 503 Service Unavailable
      summary: /agent/run
      tags:
      - Agent
      operationId: agent-run-post-3
  /agent/run/*:
    delete:
      description: Cancel an active agent run (including needs_human), aborting the in-flight turn, or delete a terminal one.
      parameters:
      - in: query
        name: token
        schema:
          description: The API token for authenticating the request.
          type: string
      requestBody:
        content: {}
      responses:
        '400':
          code: 400
          description: The request contains errors or didn't properly encode content.
          message: HTTP/1.1 400 Bad Request
        '401':
          code: 401
          description: The request is missing, or contains bad, authorization credentials.
          message: HTTP/1.1 401 Unauthorized
        '403':
          code: 403
          description: The request targets a destination that is not allowed.
          message: HTTP/1.1 403 Forbidden
        '404':
          code: 404
          description: Resource couldn't be found.
          message: HTTP/1.1 404 Not Found
        '408':
          code: 408
          description: The request took has taken too long to process.
          message: HTTP/1.1 408 Request Timeout
        '429':
          code: 429
          description: Too many requests are currently being processed.
          message: HTTP/1.1 429 Too Many Requests
        '500':
          code: 500
          description: An internal error occurred when handling the request.
          message: HTTP/1.1 500 Internal Server Error
        '503':
          code: 503
          description: Service is unavailable.
          message: HTTP/1.1 503 Service Unavailable
      summary: /agent/run/*
      tags:
      - Agent
      operationId: agent-run
    get:
      description: 'Poll an agent run: its status, the latest turn result and streamed step rationales, and the full turn transcript.'
      parameters:
      - in: query
        name: token
        schema:
          description: The API token for authenticating the request.
          type: string
      - in: query
        name: allowedDomains
        schema:
          description: 'Optional per-connection narrowing of the integration''s allowed-domain list.

            Extracted from the JSON `allowedDomains` query parameter. Can only narrow the

            integration''s domains, never widen them.'
          type: array
          items:
            type: string
      - in: query
        name: credentials
        schema:
          $ref: '#/components/schemas/StringRecord'
          description: 'Optional alias → `op://…` reference map for the integration above. Extracted

            from the JSON `credentials` query parameter. References are not secret;

            resolved values are never stored here. Optional — a connection can also pass

            raw `op://…` references straight to Browserless.loadSecret.'
      - in: query
        name: externalProxyServer
        schema:
          description: 'External proxy server URL for user-provided proxies.

            Format: http(s)://[username:password@]host:port

            When set, routes requests through this proxy instead of built-in residential proxies.'
          type: string
      - in: query
        name: integrationId
        schema:
          description: 'Optional 1Password integration id (op_int_…) or label for credential filling on a non-persistent

            connection. Extracted from the `integrationId` query parameter; the persistent

            session path carries the same data on session metadata instead.'
          type: string
      - in: query
        name: proxy
        schema:
          $ref: '#/components/schemas/ProxyType'
          description: 'The type of proxy to use: ''residential'' or ''datacenter''.'
      - in: query
