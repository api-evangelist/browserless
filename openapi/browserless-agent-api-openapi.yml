          message: HTTP/1.1 503 Service Unavailable
      summary: /agent/run/*
      tags:
      - Agent
      operationId: agent-run-get-1
  /agent/run/*/continue:
    post:
      description: Continue a multi-turn agent run with a follow-up task. Not enabled in v1.
      parameters: []
      requestBody:
        content:
          application/json:
            schema:
              properties:
                query:
                  description: Follow-up task for the next turn.
                  type: string
              type: object
              required:
              - query
      responses:
        '400':
          code: 400
          description: The request contains errors or didn't properly encode content.
          message: HTTP/1.1 400 Bad Request
        '401':
