openapi: 3.2.0
info:
  title: Browserless Browser REST APIs API
  version: 2.57.0
  description: 'This is the API reference for **Browserless Enterprise and Cloud** deployments. You''ll find endpoints for capturing screenshots and PDFs, scraping content, running custom browser functions, solving CAPTCHAs, bypassing bot detection with stealth browsing, managing authenticated browser profiles, and orchestrating crawls.


    The API includes REST endpoints (JSON in, JSON or binary out), WebSocket connections for direct CDP/Playwright/Puppeteer access, and CDP extensions that expose Browserless-specific commands like `liveURL`, `solveCaptcha`, and `reconnect`. For the open-source container API, see the GitHub repository.


    ## Just Getting Started?


    Check out the Quick Start guide to launch your first session, or explore the BrowserQL IDE for a GraphQL-based automation workflow.


    ## Base URL


    All API requests go to your deployment''s base URL. For Browserless Cloud:


    ```plaintext

    https://production-sfo.browserless.io

    ```


    Self-hosted Enterprise deployments use the host and port where the container is running (default `http://localhost:3000`).


    ## Authentication


    Include your API token as a query parameter on every request:


    ```plaintext

    https://production-sfo.browserless.io/chromium/content?token=YOUR_API_TOKEN

    ```


    Tokens are managed from the Account dashboard. Self-hosted deployments set the token via the `TOKEN` environment variable. See connection details for all authentication options.


    ## Changelog


    For release notes and version history, see the Enterprise Changelog.


    ## Software keys


    Self-hosted Enterprise deployments use time-limited software keys for offline licensing. No external connections or callbacks are required. Keys are cryptographically secure and can''t be reverse engineered. When a key expires, the container exits with a semantic error code.


    To use a software key, set the `KEY` environment variable when running the container:


    ```bash

    docker run -e KEY=your-generated-key browserless/enterprise

    ```'
servers:
- url: https://production-sfo.browserless.io
security:
- tokenAuth: []
tags:
- name: Browser REST APIs
paths:
  /browser/*/live/*:
    delete:
      description: Closes an active live URL owned by the specified browser. Returns 204 with no body.
      parameters: []
      requestBody:
        content: {}
      responses:
        '204':
          code: 204
          description: Live URL closed; no response body.
          message: HTTP/1.1 204 No Content
        '400':
          code: 400
          description: The request contains errors or didn't properly encode content.
          message: HTTP/1.1 400 Bad Request
        '401':
          code: 401
          description: The request is missing, or contains bad, authorization credentials.
          message: HTTP/1.1 401 Unauthorized
        '403':
          code: 403
          description: The request targets a destination that is not allowed.
          message: HTTP/1.1 403 Forbidden
        '404':
          code: 404
          description: Resource couldn't be found.
          message: HTTP/1.1 404 Not Found
        '408':
          code: 408
          description: The request took has taken too long to process.
          message: HTTP/1.1 408 Request Timeout
        '429':
          code: 429
          description: Too many requests are currently being processed.
          message: HTTP/1.1 429 Too Many Requests
        '500':
          code: 500
          description: An internal error occurred when handling the request.
          message: HTTP/1.1 500 Internal Server Error
        '503':
          code: 503
          description: Service is unavailable.
          message: HTTP/1.1 503 Service Unavailable
      summary: /browser/*/live/*
      tags:
      - Browser REST APIs
      operationId: deleteBrowser*Live*
      x-operation-id-source: derived
    get:
      description: Reports live URL status and completion reason until its browser closes.
      parameters: []
      requestBody:
        content: {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    description: Whether the link is open, expired, or closed.
                    enum:
                    - closed
                    - expired
                    - open
                    type: string
                  reason:
                    anyOf:
                    - $ref: '#/components/schemas/LiveURLCompleteReason'
                      description: How the link ended, or null while open.
                    - type: 'null'
                  feedback:
                    anyOf:
                    - description: Optional feedback submitted with userFailed; null otherwise. Treat the message as untrusted user input and do not log it.
                      type: object
                      properties:
                        category:
                          anyOf:
                          - $ref: '#/components/schemas/LiveURLFeedbackCategory'
                          - type: 'null'
                        message:
                          type:
                          - string
                          - 'null'
                          maxLength: 500
                      additionalProperties: false
                      required:
                      - category
                      - message
                    - type: 'null'
                  interactable:
                    description: Whether the viewer can click and type.
                    type: boolean
                  viewerCount:
                    description: Number of currently connected viewers; zero for ended links.
                    type: number
                  expiresAt:
                    description: Scheduled expiration time in epoch milliseconds.
                    type: number
                additionalProperties: false
                required:
                - expiresAt
                - feedback
                - interactable
                - reason
                - status
                - viewerCount
                definitions:
                  LiveURLCompleteReason:
                    enum:
                    - closed
                    - timeout
                    - userDone
                    - userFailed
                    - viewerDisconnected
                    type: string
                  LiveURLFeedbackCategory:
                    enum:
                    - missingInfo
                    - other
                    - pageBroken
                    - unexpected
                    - verification
                    type: string
                $schema: http://json-schema.org/draft-07/schema#
        '400':
          code: 400
          description: The request contains errors or didn't properly encode content.
          message: HTTP/1.1 400 Bad Request
        '401':
          code: 401
          description: The request is missing, or contains bad, authorization credentials.
          message: HTTP/1.1 401 Unauthorized
        '403':
          code: 403
          description: The request targets a destination that is not allowed.
          message: HTTP/1.1 403 Forbidden
        '404':
          code: 404
          description: Resource couldn't be found.
          message: HTTP/1.1 404 Not Found
        '408':
          code: 408
          description: The request took has taken too long to process.
          message: HTTP/1.1 408 Request Timeout
        '429':
          code: 429
          description: Too many requests are currently being processed.
          message: HTTP/1.1 429 Too Many Requests
        '500':
          code: 500
          description: An internal error occurred when handling the request.
          message: HTTP/1.1 500 Internal Server Error
        '503':
          code: 503
          description: Service is unavailable.
          message: HTTP/1.1 503 Service Unavailable
      summary: /browser/*/live/*
      tags:
      - Browser REST APIs
      operationId: browser-live-get-1
  /chromium/agent/capabilities:
    get:
      description: 'Returns the versioned capabilities declared by the Chromium agent route.

        Supply the intended route query parameters so authentication and plan checks

        can reject unsupported combinations before a browser is allocated.'
      parameters:
      - in: query
        name: allowedDomains
        schema:
          description: 'Optional per-connection narrowing of the integration''s allowed-domain list.

            Extracted from the JSON `allowedDomains` query parameter. Can only narrow the

            integration''s domains, never widen them.'
          type: array
          items:
            type: string
      - in: query
        name: blockAds
        schema:
          description: 'Whether or not to load ad-blocking extensions for the session.

            This currently uses uBlock-Lite and may cause certain sites

            to not load properly.'
          type: boolean
      - in: query
        name: blockAdsInclude
        schema:
          description: Ruleset IDs to load when `blockAds` is enabled, as CSV or JSON-array text.
          type: string
      - in: query
        name: blockConsentModals
        schema:
          type: boolean
      - in: query
        name: credentials
        schema:
          $ref: '#/components/schemas/StringRecord'
          description: 'Optional alias → `op://…` reference map for the integration above. Extracted

            from the JSON `credentials` query parameter. References are not secret;

            resolved values are never stored here. Optional — a connection can also pass

            raw `op://…` references straight to Browserless.loadSecret.'
      - in: query
        name: deviceScaleFactor
        schema:
          description: 'Device pixel ratio for the desktop screen above (allowed: 1 or 1.25).

            Omit to default to the seeded/profile scale. Ignored for emulationOs=android.'
          type: number
      - in: query
        name: deviceSlot
        schema:
          description: 'Pin this session to one of your identity''s N stable device slots (0-based,

            default N=8). Each slot is one virtual machine: its GPU, screen, cores, memory

            and OS version stay fixed across sessions, so traffic spreads over N machines

            instead of clustering on one. Requires a desktop emulationOs.'
          type: number
      - in: query
        name: emulatedDevice
        schema:
          description: 'Device model for mobile personas (emulationOs=android), e.g. "pixel-8",

            "galaxy-s23". Omit to auto-pick a device seeded per session (stable per

            identity, spread across the fleet); an unknown slug does the same.'
          type: string
      - in: query
        name: emulationOs
        schema:
          $ref: '#/components/schemas/Platform'
          description: 'Spoof OS for full per-platform stealth: windows | macos | linux | android.'
      - in: query
        name: externalProxyServer
        schema:
          description: 'External proxy server URL for user-provided proxies.

            Format: http(s)://[username:password@]host:port

            When set, routes requests through this proxy instead of built-in residential proxies.'
          type: string
      - in: query
        name: humanlike
        schema:
          type: boolean
      - in: query
        name: integrationId
        schema:
          description: 'Optional 1Password integration id (op_int_…) or label for credential filling on a non-persistent

            connection. Extracted from the `integrationId` query parameter; the persistent

            session path carries the same data on session metadata instead.'
          type: string
      - in: query
        name: launch
        schema:
          description: 'Launch options, which can be either an object

            of puppeteer.launch options or playwright.launchServer

            options, depending on the API. Must be either JSON

            object, or a base64-encoded JSON object.'
          anyOf:
          - $ref: '#/components/schemas/CDPLaunchOptions'
          - type: string
      - in: query
        name: profile
        schema:
          description: 'Name of an authenticated profile to hydrate into the browser at launch.

            The profile''s cookies, localStorage and IndexedDB are injected via CDP

            before your code runs. No-op in builds without a profile subsystem.'
          type: string
      - in: query
        name: proxy
        schema:
          $ref: '#/components/schemas/ProxyType'
          description: 'The type of proxy to use: ''residential'' or ''datacenter''.'
      - in: query
        name: proxyCity
        schema:
          description: 'The city to use for the proxy.


            Available cities: https://production-sfo.browserless.io/proxy/cities?token=YOUR_TOKEN

            Documentation: https://docs.browserless.io/baas/features/proxies#built-in-residential-proxy'
          type: string
      - in: query
        name: proxyCountry
        schema:
          description: 'A two-letter country code for the proxy configuration.


            Supported codes: US, GB, FR, DE, etc.

            Full list: https://docs.browserless.io/bql-schema/types/enums/country-type'
          type: string
      - in: query
        name: proxyLocaleMatch
        schema:
          description: 'Sets the browser''s language to match the proxy''s geographic location.

            Recommended when using proxyCountry to ensure websites render content,

            currency, and formatting in the local language. Default is English (en-US).'
          enum:
          - '0'
          - '1'
          - 'false'
          - 'true'
          type: string
      - in: query
        name: proxyPreset
        schema:
          description: 'A preset code for website-specific proxy routing.

            Maps to specific proxy vendors internally for optimal access to certain websites.

            Only applies to the residential network; the datacenter pool ignores it.

            Format: "px_<identifier>" (e.g., "px_gov01", "px_amazon01")'
          type: string
      - in: query
        name: proxyState
        schema:
          description: The state or province to use for the proxy, whitespace must be replaced with underscores
          type: string
      - in: query
        name: proxySticky
        schema:
          description: Whether or not to use the same IP for all requests. Off by default.
          enum:
          - '0'
          - '1'
          - 'false'
          - 'true'
          type: string
      - in: query
        name: record
        schema:
          type: boolean
      - in: query
        name: replay
        schema:
          type: boolean
      - in: query
        name: screen
        schema:
          description: 'Desktop screen resolution as WIDTHxHEIGHT (e.g. ''1920x1080''). Sets the

            reported screen.*, window size and (with deviceScaleFactor) DPR for a

            desktop persona. Omit to auto-pick a screen seeded per session (stable per

            identity, spread across the fleet). Ignored for emulationOs=android.'
          type: string
      - in: query
        name: sessionId
        schema:
          description: Attach to a pre-created profile/creation session (autologin).
          type: string
      - in: query
        name: timeout
        schema:
          description: 'Override the system-level timeout for this request.

            Accepts a value in milliseconds.'
          type: number
      - in: query
        name: token
        schema:
          description: The authorization token
          type: string
      - in: query
        name: trackingId
        schema:
          description: Custom session identifier
          type: string
      requestBody:
        content: {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  version:
                    type: number
                    const: 1
                    default: 1
                  route:
                    type: string
                    const: /chromium/agent
                  capabilities:
                    type: object
                    properties:
                      vision:
                        type: object
                        properties:
                          available:
                            type: boolean
                            const: true
                            default: true
                          primitives:
                            type: array
                            items:
                            - type: string
                              const: screenshot
                            - type: string
                              const: viewport
                            minItems: 2
                            maxItems: 2
                            default:
                            - screenshot
                            - viewport
                          availableAt:
                            type: array
                            items:
                            - type: string
                              const: /chromium/agent
                            minItems: 1
                            maxItems: 1
                        additionalProperties: false
                        required:
                        - available
                        - availableAt
                        - primitives
                      os-spoofing:
                        type: object
                        properties:
                          available:
                            type: boolean
                            const: true
                            default: true
                          queryParameters:
                            type: array
                            items:
                            - type: string
                              const: emulationOs
                            minItems: 1
                            maxItems: 1
                            default:
                            - emulationOs
                          availableAt:
                            type: array
                            items:
                            - type: string
                              const: /chromium/agent
                            - type: string
                              const: /stealth/bql
                            minItems: 2
                            maxItems: 2
                        additionalProperties: false
                        required:
                        - available
                        - availableAt
                        - queryParameters
                      datacenter-proxy:
                        type: object
                        properties:
                          available:
                            type: boolean
                            const: true
                            default: true
                          queryParameters:
                            type: array
                            items:
                            - type: string
                              const: proxy
                            minItems: 1
                            maxItems: 1
                            default:
                            - proxy
                          values:
                            type: array
                            items:
                            - type: string
                              const: datacenter
                            minItems: 1
                            maxItems: 1
                            default:
                            - datacenter
                          availableAt:
                            type: array
                            items:
                            - type: string
                              const: /chromium/agent
                            - type: string
                              const: /stealth/bql
                            minItems: 2
                            maxItems: 2
                        additionalProperties: false
                        required:
                        - available
                        - availableAt
                        - queryParameters
                        - values
                      secret-capture:
                        type: object
                        properties:
                          available:
                            type: boolean
                            const: true
                            default: true
                          primitives:
                            type: array
                            items:
                            - type: string
                              const: loadSecret
                            - type: string
                              const: saveSecret
                            - type: string
                              const: clearSecrets
                            - type: string
                              const: goto
                            - type: string
                              const: screenshot
                            minItems: 5
                            maxItems: 5
                            default:
                            - loadSecret
                            - saveSecret
                            - clearSecrets
                            - goto
                            - screenshot
                          ordering:
                            type: string
                            const: Run screenshots before loadSecret, or run clearSecrets or a top-frame navigation before capturing. saveSecret is not gated by the capture gate and may run at any point.
                            default: Run screenshots before loadSecret, or run clearSecrets or a top-frame navigation before capturing. saveSecret is not gated by the capture gate and may run at any point.
                          availableAt:
                            type: array
                            items:
                            - type: string
                              const: /chromium/agent
                            minItems: 1
                            maxItems: 1
                        additionalProperties: false
                        required:
                        - available
                        - availableAt
                        - ordering
                        - primitives
                    additionalProperties: false
                    required:
                    - datacenter-proxy
                    - os-spoofing
                    - secret-capture
                    - vision
                additionalProperties: false
                required:
                - capabilities
                - route
                - version
                $schema: http://json-schema.org/draft-07/schema#
        '400':
          code: 400
          description: The request contains errors or didn't properly encode content.
          message: HTTP/1.1 400 Bad Request
        '401':
          code: 401
          description: The request is missing, or contains bad, authorization credentials.
          message: HTTP/1.1 401 Unauthorized
        '403':
          code: 403
          description: The request targets a destination that is not allowed.
          message: HTTP/1.1 403 Forbidden
        '404':
          code: 404
          description: Resource couldn't be found.
          message: HTTP/1.1 404 Not Found
        '408':
          code: 408
          description: The request took has taken too long to process.
          message: HTTP/1.1 408 Request Timeout
        '429':
          code: 429
          description: Too many requests are currently being processed.
          message: HTTP/1.1 429 Too Many Requests
        '500':
          code: 500
          description: An internal error occurred when handling the request.
          message: HTTP/1.1 500 Internal Server Error
        '503':
          code: 503
          description: Service is unavailable.
          message: HTTP/1.1 503 Service Unavailable
      summary: /chromium/agent/capabilities
      tags:
      - Browser REST APIs
      operationId: getChromiumAgentCapabilities
      x-operation-id-source: derived
  /scrapers:
    get:
      description: 'Lists the scrapers and APIs available from the loaded scraper bundle, with

        the bundle version and each API''s output schema. Call

        POST /scrapers/{scraper}/{api} to run one.'
      parameters:
      - in: query
        name: token
        schema:
          description: 'The API token for authenticating the request. Can also be provided as a

            Bearer token in the Authorization header.'
          type: string
      - in: query
        name: allowedDomains
        schema:
          description: 'Optional per-connection narrowing of the integration''s allowed-domain list.

            Extracted from the JSON `allowedDomains` query parameter. Can only narrow the

            integration''s domains, never widen them.'
          type: array
          items:
            type: string
      - in: query
        name: credentials
        schema:
          $ref: '#/components/schemas/StringRecord'
          description: 'Optional alias → `op://…` reference map for the integration above. Extracted

            from the JSON `credentials` query parameter. References are not secret;

            resolved values are never stored here. Optional — a connection can also pass

            raw `op://…` references straight to Browserless.loadSecret.'
      - in: query
        name: externalProxyServer
        schema:
          description: 'External proxy server URL for user-provided proxies.

            Format: http(s)://[username:password@]host:port

            When set, routes requests through this proxy instead of built-in residential proxies.'
          type: string
      - in: query
        name: integrationId
        schema:
          description: 'Optional 1Password integration id (op_int_…) or label for credential filling on a non-persistent

            connection. Extracted from the `integrationId` query parameter; the persistent

            session path carries the same data on session metadata instead.'
          type: string
      - in: query
        name: proxy
        schema:
          $ref: '#/components/schemas/ProxyType'
          description: 'The type of proxy to use: ''residential'' or ''datacenter''.'
      - in: query
        name: proxyCity
        schema:
          description: 'The city to use for the proxy.


            Available cities: https://production-sfo.browserless.io/proxy/cities?token=YOUR_TOKEN

            Documentation: https://docs.browserless.io/baas/features/proxies#built-in-residential-proxy'
          type: string
      - in: query
        name: proxyCountry
        schema:
          description: 'A two-letter country code for the proxy configuration.


            Supported codes: US, GB, FR, DE, etc.

            Full list: https://docs.browserless.io/bql-schema/types/enums/country-type'
          type: string
      - in: query
        name: proxyLocaleMatch
        schema:
          description: 'Sets the browser''s language to match the proxy''s geographic location.

            Recommended when using proxyCountry to ensure websites render content,

            currency, and formatting in the local language. Default is English (en-US).'
          enum:
          - '0'
          - '1'
          - 'false'
          - 'true'
          type: string
      - in: query
        name: proxyPreset
        schema:
          description: 'A preset code for website-specific proxy routing.

            Maps to specific proxy vendors internally for optimal access to certain websites.

            Only applies to the residential network; the datacenter pool ignores it.

            Format: "px_<identifier>" (e.g., "px_gov01", "px_amazon01")'
          type: string
      - in: query
        name: proxyState
        schema:
          description: The state or province to use for the proxy, whitespace must be replaced with underscores
          type: string
      - in: query
        name: proxySticky
        schema:
          description: Whether or not to use the same IP for all requests. Off by default.
          enum:
          - '0'
          - '1'
          - 'false'
          - 'true'
          type: string
      requestBody:
        content: {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  version:
                    description: 'Bundle version (semver only). The build''s git sha is never part of a

                      response; operators find it in the logs and the info metric.'
                    type: string
                  contractVersion:
                    description: 'Contract version the bundle was built against; equals the runtime''s

                      CONTRACT_VERSION.'
                    type: number
                  previousVersion:
                    description: 'Version that was live before the last hot swap (semver only); null until

                      the first swap on this instance.'
                    type: string
                  swap:
                    description: 'Hot-swap state: whether a replacement bundle is being verified or

                      handshaked right now, which version it is, and how the last swap ended.'
                    type: object
                    properties:
                      inProgress:
                        type: boolean
                      targetVersion:
                        type: string
                      startedAt:
                        type: string
                      lastOutcome:
                        type: string
                      lastAt:
                        type: string
                    additionalProperties: false
                    required:
                    - inProgress
                    - lastAt
                    - lastOutcome
                    - startedAt
                    - targetVersion
                  scrapers:
                    description: 'Catalog keyed by scraper name (an organisation slug such as `zillow`,

                      never a hostname). Each scraper lists the DNS hosts it handles and its

                      APIs; each API declares its result-cache TTL and the JSON Schema its

                      `data` is validated against on every result.'
                    type: object
                    additionalProperties:
                      type: object
                      properties:
                        hostnames:
                          description: 'Every DNS host this scraper handles — one organisation may span

                            several.'
                          type: array
                          items:
                            type: string
                        apis:
                          type: object
                          additionalProperties:
                            type: object
                            properties:
                              ttlSeconds:
                                description: Seconds a result for this API stays fresh in the result cache.
                                type: number
                              units:
                                description: 'Units one call costs. Charged when the call returns HTTP 200 with

                                  `ok: true` or error code `not-found`; every other outcome is free.'
                                type: number
                              outputSchema:
                                description: 'JSON Schema (draft 2020-12) the API''s `data` is validated against.

                                  The host enforces it on every result.'
                                type: object
                                additionalProperties: {}
                            additionalProperties: false
                            required:
                            - outputSchema
                            - ttlSeconds
                            - units
                      additionalProperties: false
                      required:
                      - apis
                      - hostnames
                additionalProperties: false
                required:
                - contractVersion
                - previousVersion
                - scrapers
                - swap
                - version
                $schema: http://json-schema.org/draft-07/schema#
        '400':
          code: 400
          description: The request contains errors or didn't properly encode content.
          message: HTTP/1.1 400 Bad Request
        '401':
          code: 401
          description: The request is missing, or contains bad, authorization credentials.
          message: HTTP/1.1 401 Unauthorized
        '403':
          code: 403
          description: The request targets a destination that is not allowed.
          message: HTTP/1.1 403 Forbidden
        '404':
          code: 404
          description: Resource couldn't be found.
          message: HTTP/1.1 404 Not Found
        '408':
          code: 408
          description: The request took has taken too long to process.
          message: HTTP/1.1 408 Request Timeout
        '429':
          code: 429
          description: Too many requests are currently being processed.
          message: HTTP/1.1 429 Too Many Requests
        '500':
          code: 500
          description: An internal error occurred when handling the request.
          message: HTTP/1.1 500 Internal Server Error
        '503':
          code: 503
          description: Service is unavailable.
          message: HTTP/1.1 503 Service Unavailable
      summary: /scrapers
      tags:
      - Browser REST APIs
      operationId: getScrapers
      x-operation-id-source: derived
  /scrapers/*/*:
    post:
      description: 'Runs one API of a predefined scraper from the loaded scraper bundle:

        POST /scrapers/{scraper}/{api}, where {scraper} is the scraper name (an

        organisation slug such as zillow — never a hostname) and {api} is one of

        its APIs, both as listed by GET /scrapers.


        The body is the API''s input ({ url?, params? }). A scraper that runs and

        reports a typed scrape error (blocked, not-found, invalid-input,

        upstream-changed, upstream-error) still returns HTTP 200 with ok:false.

        HTTP 4xx/5xx is reserved for host-level failures (unknown scraper/api,

        bundle unavailable, overloaded, job timeout, worker crash, job drained

        by a bundle hot swap, invalid

        result). Every ok:true result has been validated against the API''s

        declared output schema.'
      parameters:
      - in: query
        name: timeout
        schema:
          description: 'Job timeout in milliseconds. Defaults to your plan''s maximum session time;

            an explicit value must be a whole number between 1 and that maximum, or

            the request fails with HTTP 400. The worker also caps it at the server''s

            30-minute ceiling. A job that exceeds it fails with HTTP 408 and error

            code `job-timeout`.'
          type: number
      - in: query
        name: token
        schema:
          description: 'The API token for authenticating the request. Can also be provided as a

            Bearer token in the Authorization header.'
          type: string
      - in: query
        name: allowedDomains
        schema:
          description: 'Optional per-connection narrowing of the integration''s allowed-domain list.

            Extracted from the JSON `allowedDomains` query parameter. Can only narrow the

            integration''s domains, never widen them.'
          type: array
          items:
            type: string
      - in: query
        name: credentials
        schema:
          $ref: '#/components/schemas/StringRecord'
          description: 'Optional alias → `op://…` reference map for the integration above. Extracted

            from the JSON `credentials` query parameter. References are not secret;

            resolved values are never stored here. Optional — a connection can also pass

            raw `op://…` references straight to Browserless.loadSecret.'
      - in: query
        name: externalProxyServer
        schema:
          description: 'External proxy server URL for user-provided proxies.

            Format: http(s)://[username:password@]host:port

            When set, routes requests through this proxy instead of built-in residential proxies.'
          type: string
      - in: query
        name: integrationId
        schema:
          description: 'Optional 1Password integration id (op_int_…) or label for credential filling on a non-persistent

            connection. Extracted from the `integrationId` query parameter; the persistent

            session path carries the same data on session metadata instead.'
          type: string
      - in: query
        name: proxy
        schema:
          $ref: '#/components/schemas/ProxyType'
          description: 'The type of proxy to use: ''residential'' or ''datacenter''.'
      - in: query
        name: proxyCity
        schema:
          description: 'The city to use for the proxy.


            Available cities: https://production-sfo.browserless.io/proxy/cities?token=YOUR_TOKEN

            Documentation: https://docs.browserless.io/baas/features/proxies#built-in-residential-proxy'
          type: string
      - in: query
        name: proxyCountry
        schema:
          description: 'A two-letter country code for the proxy configuration.


            Supported codes: US, GB, FR, DE, etc.

            Full list: https://docs.browserless.io/bql-schema/types/enums/country-type'
          type: string
      - in: query
        name: proxyLocaleMatch
        schema:
          description: 'Sets the browser''s language to match the proxy''s geographic location.

            Recommended when using proxyCountry to ensure websites render content,

            currency, and formatting in the local language. Default is English (en-US).'
          enum:
          - '0'
          - '1'
          - 'false'
          - 'true'
          type: string
      - in: query
        name: proxyPreset
        schema:
          description: 'A preset code for website-specific proxy routing.

            Maps to specific proxy vendors internally for optimal access to certain websites.

            Only applies to the residential network; the datacenter pool ignores it.

            Format: "px_<identifier>" (e.g., "px_gov01", "px_amazon01")'
          type: string
      - in: query
        name: proxyState
        schema:
          description: The state or province to use for the proxy, whitespace must be replaced with underscores
          type: string
      - in: query
        name: proxySticky
        schema:
          description: Whether or not to use the same IP for all requests. Off by default.
          enum:
          - '0'
          - '1'
          - 'false'
          - 'true'
          type: string
      requestBody:
        content:
          application/json:
            schema:
              properties:
                url:
                  description: 'Target URL when the API is URL-addressed (e.g. a listing page). Validated

                    by the scraper: an off-domain or off-pattern URL yields an

                    `invalid-input` scrape error.'
                  type: string
                params:
                  description: 'API-specific parameters (e.g. `{ "zpid": "12345" }`). Values must be

                    strings, numbers or booleans. Validated by the scraper.'
                  type: object
                  additionalProperties:
                    type:
                    - string
                    - number
                    - boolean
              type: object
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    description: '`true` when the scraper ran and produced data. `false` when it reported a

                      typed scrape error (HTTP 200) or when the host could not run it (HTTP

                      4xx/5xx).'
                    type: boolean
                  data:
                    description: 'API-specific JSON payload when `ok` is true; null otherwise. Always

                      conforms to the API''s declared output schema (see GET /scrapers).'
                  error:
                    description: 'Error detail when `ok` is false; null otherwise. Two disjoint code

                      namespaces: scraper-level (`blocked`, `not-found`, `invalid-input`,

                      `upstream-changed`, `upstream-error`) always arrive with HTTP 200;

                      host-level (`bundle-unavailable`, `unknown-scraper`, `unknown-api`,

                      `input-not-cloneable`, `overloaded`, `job-timeout`, `worker-crashed`,

                      `job-drained`, `invalid-result`) arrive with the matching HTTP status.'
                    type: object
                    properties:
                      code:
                        description: 'Machine-readable code — see the two namespaces above. Identical across

                          enterprise and cloud; only `message` wording differs.'
                        enum:
                        - blocked
                        - bundle-unavailable
                        - input-not-cloneable
                        - invalid-input
                        - invalid-result
                        - job-drained
                        - job-timeout
                        - not-found
                        - overloaded
                        - unknown-api
                        - unknown-scraper
                        - upstream-changed
                        - upstream-error
                        - worker-crashed
                        type: string
                      message:
                        description: 'Human-readable explanation. Host-level messages carry a

                          `(requestId: …)` suffix.'
                        type: string
                      retryable:
                        description: 'Whether a retry (new proxy/session, or simply later) is plausibly

                          useful.'
                        type: boolean
                      status:
                        description: 'Upstream HTTP status when a scraper failure came from a response; null

                          otherwise.'
                        type: number
                      details:
                        description: 'Structured detail from the scraper (e.g. the selector that missed);

                          null otherwise.'
                        type: object
                        additionalProperties: {}
                    additionalProperties: false
                    required:
                    - code
                    - details
                    - message
                    - retryable
                    - status
                additionalProperties: false
                required:
                - data
                - error
                - ok
                $schema: http://json-schema.org/draft-07/schema#
        '400':
          code: 400
          description: The request contains errors or didn't properly encode content.
          message: HTTP/1.1 400 Bad Request
        '401':
          code: 401
          description: The request is missing, or contains bad, authorization credentials.
          message: HTTP/1.1 401 Unauthorized
        '403':
          code: 403
          description: The request targets a destination that is not allowed.
          message: HTTP/1.1 403 Forbidden
        '404':
          code: 404
          description: Resource couldn't be found.
          message: HTTP/1.1 404 Not Found
        '408':
          code: 408
          description: The request took has taken too long to process.
          message: HTTP/1.1 408 Request Timeout
        '429':
          code: 429
          description: Too many requests are currently being processed.
          message: HTTP/1.1 429 Too Many Requests
        '500':
          code: 500
          description: An internal error occurred when handling the request.
          message: HTTP/1.1 500 Internal Server Error
        '503':
          code: 503
          description: Service is unavailable.
          message: HTTP/1.1 503 Service Unavailable
      summary: /scrapers/*/*
      tags:
      - Browser REST APIs
      operationId: scrapers-post-1
components:
  schemas:
    StringRecord:
      type: object
      additionalProperties: false
    ProxyType:
      description: 'The proxy networks the platform can route through. `residential` uses the

        built-in residential vendors; `datacenter` uses the Geonode datacenter

        network (cheaper, billed at a lower per-MB rate).'
      enum:
      - datacenter
      - residential
      type: string
    CDPLaunchOptions:
      type: object
      additionalProperties: {}
      properties:
        args:
          type: array
          items:
            type: string
        defaultViewport:
          type: object
          properties:
            deviceScaleFactor:
              type: number
            hasTouch:
              type: boolean
            height:
              type: number
            isLandscape:
              type: boolean
            isMobile:
              type: boolean
            width:
              type: number
          additionalProperties: false
          required:
          - height
          - width
        devtools:
          type: boolean
        dumpio:
          type: boolean
        headless:
          enum:
          - false
          - shell
          - true
        ignoreDefaultArgs:
          anyOf:
          - type: array
            items:
              type: string
          - type: boolean
        ignoreHTTPSErrors:
          type: boolean
        acceptInsecureCerts:
          type: boolean
        slowMo:
          type: number
        stealth:
          type: boolean
        timeout:
          type: number
        userDataDir:
          type: string
        waitForInitialPage:
          type: boolean
    LiveURLCompleteReason:
      enum:
      - closed
      - timeout
      - userDone
      - userFailed
      - viewerDisconnected
      type: string
    LiveURLFeedbackCategory:
      enum:
      - missingInfo
      - other
      - pageBroken
      - unexpected
      - verification
      type: string
    Platform:
      enum:
      - android
      - linux
      - macos
      - windows
      type: string
  securitySchemes:
    tokenAuth:
      type: apiKey
      in: query
      name: token
      description: Your Browserless API token. Find it on your [Account dashboard](https://www.browserless.io/account).
